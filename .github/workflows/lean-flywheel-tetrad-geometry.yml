name: Lean proof — intrinsic flywheel geometry

on:
  push:
    branches: [main, 'fix/proof24-lean']
    paths:
      - 'proofs/flywheel-tetrad-geometry/lean/**'
      - 'proofs/recursive-triforce-closure/lean/**'
      - 'proofs/half-space-two-bounded-regions/lean/**'
      - 'proofs/forced-tetrahedral-frame/lean/**'
      - '.github/workflows/lean-flywheel-tetrad-geometry.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/flywheel-tetrad-geometry/lean
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download compiled Mathlib
        run: lake exe cache get
      - name: Build the proof and its dependencies
        run: lake build
      - name: Confirm no warnings, no sorry and only standard axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean FlywheelTetradGeometry.lean | tee axioms.txt
          if grep -qE 'warning:|error:|sorryAx' axioms.txt; then exit 1; fi
          count=$(grep -Ec 'depends on axioms|does not depend on any axioms' axioms.txt || true)
          echo "axiom reports: $count"
          if [ "$count" -lt 50 ]; then echo 'Expected 50 reports'; exit 1; fi
          if grep 'depends on axioms' axioms.txt | grep -vE '\[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]|\[\]'; then
            echo 'Non-standard axiom'; exit 1
          fi
      - name: Show dependency manifest
        if: always()
        run: cat lake-manifest.json || true
