name: Lean proof — Great Pyramid GP5 (exploratory)

on:
  push:
    paths:
      - 'research/exploratory/great-pyramid/proofs/gp5-two-site-transfer-bound/lean/**'
      - '.github/workflows/lean-great-pyramid-gp5.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/exploratory/great-pyramid/proofs/gp5-two-site-transfer-bound/lean
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download compiled Mathlib
        run: lake exe cache get

      - name: Build the proof
        run: lake build

      - name: Confirm no warnings, no sorry and only standard axioms
        run: |
          lake env lean TransferBound.lean 2>&1 | tee axioms.txt
          if grep -qE "warning:|error:" axioms.txt; then echo "Lean reported a warning or error"; exit 1; fi
          count=$(grep -c "depends on axioms" axioms.txt || true)
          echo "axiom reports: $count"
          if [ "$count" -lt 12 ]; then echo "expected 12 axiom reports"; exit 1; fi
          if grep -q sorryAx axioms.txt; then echo "a theorem depends on sorry"; exit 1; fi
          if grep "depends on axioms" axioms.txt | grep -vE "\[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]"; then
            echo "a theorem uses a non-standard axiom"; exit 1
          fi

      - name: Show the resolved dependency manifest
        if: always()
        run: cat lake-manifest.json || true
