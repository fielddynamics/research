name: Lean proof — BIMOND two-potential energy

on:
  push:
    branches: [main]
    paths:
      - 'proofs/bimetric-two-potential-energy/lean/**'
      - 'proofs/aqual-energy-functional/lean/**'
      - 'proofs/constitutive-law-exchange-symmetry/lean/**'
      - 'proofs/tetrad-scheme-two-bounded-regions/lean/**'
      - 'proofs/half-space-two-bounded-regions/lean/**'
      - 'proofs/forced-tetrahedral-frame/lean/**'
      - '.github/workflows/lean-bimond-two-potential-energy.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/bimetric-two-potential-energy/lean
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download compiled Mathlib
        run: lake exe cache get

      - name: Build the proof (and the proofs it imports)
        run: lake build

      - name: Confirm no warnings, no sorry and only standard axioms
        run: |
          lake env lean BimondInteraction.lean | tee axioms.txt
          if grep -qE "warning:|error:" axioms.txt; then echo "Lean reported a warning or error"; exit 1; fi
          count=$(grep -c "depends on axioms" axioms.txt || true)
          echo "axiom reports: $count"
          if [ "$count" -lt 16 ]; then echo "expected 16 axiom reports"; exit 1; fi
          if grep -q sorryAx axioms.txt; then echo "a theorem depends on sorry"; exit 1; fi
          # each theorem may use any of Lean's three standard axioms, and nothing else
          if grep "depends on axioms" axioms.txt | grep -vE "\[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]"; then
            echo "a theorem uses a non-standard axiom"; exit 1
          fi

      - name: Show the resolved dependency manifest
        if: always()
        run: cat lake-manifest.json || true
