name: Lean proof — tetrad and flywheel convergence
on:
  push:
    branches: [main]
    paths:
      - 'proofs/tetrad-flywheel-convergence/lean/**'
      - 'proofs/flywheel-tetrad-geometry/lean/**'
      - 'proofs/recursive-triforce-closure/lean/**'
      - 'proofs/half-space-two-bounded-regions/lean/**'
      - 'proofs/forced-tetrahedral-frame/lean/**'
      - '.github/workflows/lean-tetrad-flywheel-convergence.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/tetrad-flywheel-convergence/lean
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download compiled Mathlib
        run: lake exe cache get
      - name: Build the proof and its dependencies
        run: lake build
      - name: Audit theorem dependencies
        run: |
          set -o pipefail
          lake env lean TetradFlywheelConvergence.lean 2>&1 | tee axioms.txt
          if grep -qE 'warning:|error:|sorryAx' axioms.txt; then exit 1; fi
          count=$(grep -Ec 'depends on axioms|does not depend on any axioms' axioms.txt || true)
          if [ "$count" -ne 35 ]; then echo "Expected 35 reports, got $count"; exit 1; fi
          if grep 'depends on axioms' axioms.txt | grep -vE '\[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]'; then exit 1; fi
