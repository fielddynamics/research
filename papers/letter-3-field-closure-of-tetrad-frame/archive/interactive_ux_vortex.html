<!DOCTYPE html>
<html>
<head>
    <title>Unified Galactic Vortex: The Continuous Partition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030305; color: #c9d1d9; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; border: 1px solid #30363d;}
        h1 { margin: 0 0 10px 0; font-size: 1.3rem; font-weight: normal; color: #fff;}
        p { margin: 8px 0; font-size: 0.95rem; }
        .legend-blue { color: #4488ff; font-weight: bold; }
        .legend-purple { color: #aa55ff; font-weight: bold; }
        .legend-red { color: #ff4444; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        <h1>The Unified Gravitational Vortex</h1>
        <p>One continuous field shifting its geometric partition.</p>
        <p class="legend-blue">■ Inner Throat: TetA / Christoffel Dominance (&mu; &rarr; 1)</p>
        <p class="legend-purple">■ Crossover Ring: MOND Transition (&mu; = 0.5)</p>
        <p class="legend-red">■ Outer Rim: TetB / Torsion Dominance (&mu; &rarr; 0)</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.04);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x030305, 1);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 1.2;
        controls.target.set(0, -1, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        // Intense core light
        const coreLight = new THREE.PointLight(0x4488ff, 3, 15);
        coreLight.position.set(0, -2.5, 0);
        scene.add(coreLight);

        // Geometry Generation parameters
        const segmentsR = 150;
        const segmentsT = 150;
        const Rmax = 6;
        const Rmin = 0.1;

        const pts = [];
        const colors = [];
        const indices = [];

        // Define our colors
        const colorBlue = new THREE.Color(0x2266ff); // TetA
        const colorRed = new THREE.Color(0xff2222);  // TetB
        const tempColor = new THREE.Color();

        // Build the single continuous sheet
        for (let i = 0; i <= segmentsR; i++) {
            // Logarithmic-like radial distribution for a smoother throat
            const r = Rmin + Math.pow(i / segmentsR, 1.5) * (Rmax - Rmin);
            
            // Assume acceleration scales roughly as 1/r^2 for mapping purposes
            const x_val = 1 / (r * r); 
            // The Constitutive Law: mu(x) = x / (x + 1)
            const mu = x_val / (x_val + 1); 

            // Shape of the vortex (gravity well potential)
            const depth = -2.5 / (r + 0.3);

            // Interpolate color based on mu (1 = Blue, 0 = Red)
            tempColor.copy(colorRed).lerp(colorBlue, mu);

            for (let j = 0; j <= segmentsT; j++) {
                const theta = (j / segmentsT) * Math.PI * 2;
                const X = r * Math.cos(theta);
                const Z = r * Math.sin(theta);

                pts.push(X, depth, Z);
                colors.push(tempColor.r, tempColor.g, tempColor.b);
            }
        }

        // Generate faces
        for (let i = 0; i < segmentsR; i++) {
            for (let j = 0; j < segmentsT; j++) {
                const a = i * (segmentsT + 1) + j;
                const b = a + (segmentsT + 1);
                const c = a + 1;
                const d = b + 1;
                indices.push(a, b, d);
                indices.push(a, d, c);
            }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();

        const mat = new THREE.MeshPhongMaterial({ 
            vertexColors: true,
            side: THREE.DoubleSide, 
            shininess: 60,
            transparent: true,
            opacity: 0.9
        });

        const vortexSurface = new THREE.Mesh(geo, mat);
        scene.add(vortexSurface);

        // The MOND Transition Ring (r = 1, where mu = 0.5)
        const ringGeo = new THREE.BufferGeometry();
        const ringPts = [];
        const ringDepth = -2.5 / (1 + 0.3); // Depth at r=1
        for(let i=0; i<=150; i++) {
            const t = (i/150) * Math.PI * 2;
            ringPts.push(Math.cos(t), ringDepth + 0.02, Math.sin(t));
        }
        ringGeo.setAttribute('position', new THREE.Float32BufferAttribute(ringPts, 3));
        const ringMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Line(ringGeo, ringMat));

        // Add flow lines (spirals) to emphasize the single continuous fluid/field
        const numArms = 12;
        for (let arm = 0; arm < numArms; arm++) {
            const spiralPts = [];
            const offset = (arm / numArms) * Math.PI * 2;
            for (let r = 0.15; r <= Rmax; r += 0.05) {
                // Twist angle changes with radius to create a whirlpool effect
                const theta = offset - (r * 1.5); 
                const X = r * Math.cos(theta);
                const Z = r * Math.sin(theta);
                const depth = -2.5 / (r + 0.3);
                spiralPts.push(X, depth + 0.02, Z); 
            }
            const spiralGeo = new THREE.BufferGeometry();
            spiralGeo.setAttribute('position', new THREE.Float32BufferAttribute(spiralPts, 3));
            const spiralMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
            scene.add(new THREE.Line(spiralGeo, spiralMat));
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
