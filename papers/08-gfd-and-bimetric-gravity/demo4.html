<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GFD Microscopic Field Node: Volumetric Chambers</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: sans-serif;}
        #info {
            position: absolute; top: 15px; width: 100%; text-align: center;
            pointer-events: none; text-shadow: 0px 2px 4px rgba(0,0,0,1.0);
        }
        h2 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; color: #00ffff;}
        p { margin: 5px 0 0 0; font-size: 0.9rem; color: #dddddd; font-family: monospace;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>
    <div id="info">
        <h2>GFD Microscopic Field Node: True Inner Dynamics</h2>
        <p>Cyan = TetA (Primary) | Red = TetB (Inverted) | Gold = Field Origin (Shared Core)</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 6);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 1. Pre-allocate the MAXIMUM number of points for "Excellent" mode
        const MAX_PARTICLES = 4000000; 
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(MAX_PARTICLES * 3);

        // Fill the maximum volume once at startup
        for (let i = 0; i < MAX_PARTICLES; i++) {
            positions[i * 3]     = (Math.random() - 0.5) * 3.0;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 3.0;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 3.0;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // 2. The Volumetric Chamber Shader
        const nodeMaterial = new THREE.ShaderMaterial({
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            transparent: true,
            vertexShader: `
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = 10.0 / -mvPosition.z;

                    // The 4 Directional Planes of the Dual Tetrad
                    float v1 = position.x + position.y + position.z;
                    float v2 = position.x - position.y - position.z;
                    float v3 = -position.x + position.y - position.z;
                    float v4 = -position.x - position.y + position.z;

                    // Evaluate the strict geometric bounds
                    float tetA = max(max(v1, v2), max(v3, v4));
                    float tetB = max(max(-v1, -v2), max(-v3, -v4));

                    // Sort the spatial points into their respective physical chambers
                    if (tetA <= 1.0 && tetB <= 1.0) {
                        vColor = vec3(1.0, 0.8, 0.0); // Gold
                        vAlpha = 0.8;
                    } else if (tetA <= 1.0) {
                        vColor = vec3(0.0, 0.6, 1.0); // Cyan
                        vAlpha = 0.4;
                    } else if (tetB <= 1.0) {
                        vColor = vec3(0.8, 0.05, 0.05); // Red
                        vAlpha = 0.4;
                    } else {
                        vAlpha = 0.0; // Invisible
                    }
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    if (vAlpha == 0.0) discard;
                    
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float ll = length(xy);
                    if(ll > 0.5) discard;
                    
                    float alpha = pow((0.5 - ll) * 2.0, 1.5) * vAlpha; 
                    gl_FragColor = vec4(vColor, alpha);
                }
            `
        });

        const pointCloud = new THREE.Points(geometry, nodeMaterial);
        scene.add(pointCloud);

        // 3. UI Settings and Performance Controls
        const settings = {
            resolution: 1000000 // Default to "Medium"
        };

        // Initialize the draw range to the default resolution
        geometry.setDrawRange(0, settings.resolution);

        const gui = new lil.GUI({ title: 'Performance Settings' });
        
        // Add a dropdown menu mapped to exact particle counts
        gui.add(settings, 'resolution', {
            'Low (250k points)': 250000,
            'Medium (1M points)': 1000000,
            'High (2M points)': 2000000,
            'Excellent (4M points)': 4000000
        }).name('Resolution').onChange((newCount) => {
            // Instantly tell the GPU to draw more or fewer points from the pre-allocated buffer
            geometry.setDrawRange(0, newCount);
        });

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            pointCloud.rotation.y += 0.003;
            pointCloud.rotation.x += 0.002;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
