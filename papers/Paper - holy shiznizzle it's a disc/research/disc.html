<!DOCTYPE html>
<html>
<head>
    <title>The Tetrad Partition - Manual Flip</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', sans-serif; background-color: #05050a; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; padding: 20px; border-radius: 8px; background: rgba(0,0,0,0.7); border: 1px solid #30363d; color: #c9d1d9; }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 500; color: #fff; }
        p { margin: 5px 0; font-size: 0.9rem; }
        .legend-a { color: #4488ff; font-weight: bold; }
        .legend-b { color: #ff5555; font-weight: bold; }
        #toggle-wrap { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; gap: 10px; }
        .ui-btn { background: rgba(128,128,128,0.3); border: 1px solid rgba(128,128,128,0.5); color: #aaa; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .ui-btn:hover { background: rgba(128,128,128,0.5); color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        <h1>The Tetrad Partition</h1>
        <p class="legend-a">■ TetA (Identity)</p>
        <p class="legend-b">■ TetB (Parity)</p>
    </div>
    <div id="toggle-wrap">
        <button class="ui-btn" onclick="flipWorld()">↕ Flip Camera Up/Down</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.5, 0);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(5, 10, 5);
        scene.add(light);

        // --- GFD Geometry ---
        const seg = 100, Rmax = 5;
        const ptsA = [], ptsB = [], indices = [];
        for (let i = 0; i <= seg; i++) {
            const r = (i / seg) * Rmax;
            for (let j = 0; j <= seg; j++) {
                const theta = (j / seg) * Math.PI * 2;
                const x = r === 0 ? 1000 : 1 / (r * r);
                const mu = x / (x + 1);
                ptsA.push(r * Math.cos(theta), mu, r * Math.sin(theta));
                ptsB.push(r * Math.cos(theta), 1 - mu, r * Math.sin(theta));
            }
        }
        for (let i = 0; i < seg; i++) {
            for (let j = 0; j < seg; j++) {
                const a = i * (seg + 1) + j, b = a + (seg + 1), c = a + 1, d = b + 1;
                indices.push(a, b, d, a, d, c);
            }
        }

        function createMesh(pts, col) {
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
        }
        scene.add(createMesh(ptsA, 0x4488ff));
        scene.add(createMesh(ptsB, 0xff4444));

        // --- THE FLIP LOGIC ---
        let isUpsideDown = false;

        function flipWorld() {
            isUpsideDown = !isUpsideDown;
            
            if (isUpsideDown) {
                // Set camera up to negative Y
                camera.up.set(0, -1, 0);
                // Position camera below the disk
                camera.position.y = -3;
            } else {
                // Reset to standard up
                camera.up.set(0, 1, 0);
                // Position camera above the disk
                camera.position.y = 3;
            }
            
            // CRITICAL: You must tell OrbitControls to look at the target again 
            // from the new "Up" perspective or it will flip back.
            camera.lookAt(controls.target);
            controls.update();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
