<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-label="Trace constraint → registered response"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#536b82"/></marker></defs><rect width="1000" height="550" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="37" font-size="13" fill="#536b82" text-anchor="start" font-weight="700">GFD  /  PROJECTIVE NORM &amp; WALSH RESEARCH</text><text x="35" y="77" font-size="30" fill="#17304a" text-anchor="start" font-weight="700">Trace constraint → registered response</text><text x="35" y="106" font-size="16" fill="#536b82" text-anchor="start" font-weight="400">Remove the global identity direction; compress through the 13-point norm fibres.</text><rect x="42" y="155" width="172" height="80" rx="7" fill="#f4f8fb" stroke="#1279b7"/><text x="128.0" y="186" font-size="20" fill="#1279b7" text-anchor="middle" font-weight="700">273</text><text x="128.0" y="212" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">Matrix-unit capacity</text><path d="M214 195 L284 195" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="290" y="155" width="172" height="80" rx="7" fill="#f4f8fb" stroke="#008d82"/><text x="376.0" y="186" font-size="20" fill="#008d82" text-anchor="middle" font-weight="700">272</text><text x="376.0" y="212" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">Trace-zero rank</text><path d="M462 195 L532 195" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="538" y="155" width="172" height="80" rx="7" fill="#f4f8fb" stroke="#8054b3"/><text x="624.0" y="186" font-size="20" fill="#8054b3" text-anchor="middle" font-weight="700">272/13</text><text x="624.0" y="212" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">Compressed trace</text><path d="M710 195 L780 195" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="786" y="155" width="172" height="80" rx="7" fill="#f4f8fb" stroke="#c28414"/><text x="872.0" y="186" font-size="20" fill="#c28414" text-anchor="middle" font-weight="700">17/13</text><text x="872.0" y="212" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">Trace divided by 16</text><text x="500" y="278" font-size="28" fill="#17304a" text-anchor="middle" font-weight="700">Breg = R P Rᵀ = I − 11ᵀ/273</text><text x="80" y="318" font-size="18" fill="#536b82" text-anchor="start" font-weight="700">Spectrum of the compressed response</text><rect x="80" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="120" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="160" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="200" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="240" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="280" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="320" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="360" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="400" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="440" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="480" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="520" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="560" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="600" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="640" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="680" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="720" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="760" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="800" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="840" y="337" width="30" height="95" rx="2" fill="#1279b7" stroke="none"/><rect x="880" y="344.3076923076923" width="30" height="87.6923076923077" rx="2" fill="#c28414" stroke="none"/><text x="80" y="458" font-size="17" fill="#17304a" text-anchor="start" font-weight="400">20 unit eigenvalues</text><text x="920" y="458" font-size="17" fill="#c28414" text-anchor="end" font-weight="700">12/13</text><text x="500" y="498" font-size="17" fill="#17304a" text-anchor="middle" font-weight="400">det Breg = 12/13; the normalized trace is 17/13 (not its determinant).</text><text x="35" y="533" font-size="13" fill="#536b82" text-anchor="start" font-weight="400">Exact algebra for the specified construction; physical source and gain selection remain open.</text></g></svg>