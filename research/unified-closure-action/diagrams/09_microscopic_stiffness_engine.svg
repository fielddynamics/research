<svg xmlns="http://www.w3.org/2000/svg" width="780" height="730" viewBox="0 0 780 730"><title>Microscopic stiffness and complete mathematical architecture</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="390.0" y="30" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#17283d" font-weight="600" text-anchor="middle">Microscopic stiffness and complete mathematical architecture</text><rect x="125" y="56" width="530" height="68" rx="7" stroke="#64748b" fill="#64748b" fill-opacity="0.1"/><text x="390.0" y="90.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17283d" font-weight="600" text-anchor="middle">Field Origin and dual-tetrad geometry</text><text x="390.0" y="111.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">Original 36-coordinate Hamiltonian</text><line x1="390" y1="124" x2="390" y2="153" stroke="#64748b" stroke-width="1.4" opacity="1" marker-end="url(#arr)"/><rect x="125" y="163" width="530" height="65" rx="7" stroke="#64748b" fill="#64748b" fill-opacity="0.1"/><text x="390.0" y="195.5" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17283d" font-weight="600" text-anchor="middle">π-walk and FWHT</text><text x="390.0" y="216.5" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">Candidate balanced geometric read</text><line x1="390" y1="228" x2="390" y2="259" stroke="#64748b" stroke-width="1.4" opacity="1" marker-end="url(#arr)"/><rect x="25" y="270" width="355" height="100" rx="7" stroke="#d97706" fill="#d97706" fill-opacity="0.1"/><text x="202.5" y="320.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17283d" font-weight="600" text-anchor="middle">Collective transmission</text><text x="202.5" y="341.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">α^(1 + 4 + 16)  ·  21 contrast factors</text><rect x="400" y="270" width="355" height="100" rx="7" stroke="#0d9488" fill="#0d9488" fill-opacity="0.1"/><text x="577.5" y="320.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17283d" font-weight="600" text-anchor="middle">Structural stiffness</text><text x="577.5" y="341.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">(1 + 16 − 4)/(1 + 16) = 13/17</text><line x1="202" y1="370" x2="390" y2="412" stroke="#64748b" stroke-width="1.4" opacity="1" marker-end="url(#arr)"/><line x1="577" y1="370" x2="390" y2="412" stroke="#64748b" stroke-width="1.4" opacity="1" marker-end="url(#arr)"/><rect x="110" y="424" width="560" height="85" rx="7" stroke="#64748b" fill="#64748b" fill-opacity="0.1"/><text x="390.0" y="466.5" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17283d" font-weight="600" text-anchor="middle">Gravitational settlement</text><text x="390.0" y="487.5" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">G = (17/13) α²¹ ℏc / mₑ²</text><line x1="390" y1="509" x2="390" y2="546" stroke="#64748b" stroke-width="1.4" opacity="1" marker-end="url(#arr)"/><rect x="110" y="558" width="560" height="98" rx="7" stroke="#64748b" fill="#64748b" fill-opacity="0.1"/><text x="390.0" y="607.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17283d" font-weight="600" text-anchor="middle">Electron closure</text><text x="390.0" y="628.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">a₀ = 16Gmₑ/Rₑ²  ·  mₑc² = αℏc/Rₑ</text><text x="390" y="695" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">Conditional architecture, not an independent physical derivation.</text></svg>