<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-label="Alternating sweeps form a rotation"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#536b82"/></marker></defs><rect width="1000" height="530" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="37" font-size="13" fill="#536b82" text-anchor="start" font-weight="700">GFD  /  PROJECTIVE NORM &amp; WALSH RESEARCH</text><text x="35" y="77" font-size="30" fill="#17304a" text-anchor="start" font-weight="700">Alternating sweeps form a rotation</text><text x="35" y="106" font-size="16" fill="#536b82" text-anchor="start" font-weight="400">All three shears have determinant one. Loss appears only after retaining one output port.</text><path d="M30 270 L220 270" stroke="#d8e1e9" stroke-width="2" fill="none"/><path d="M125 175 L125 365" stroke="#d8e1e9" stroke-width="2" fill="none"/><polygon points="83,312 167,312 167,228 83,228" fill="#d9edf8" stroke="#1279b7" stroke-width="2.5"/><text x="125" y="390" font-size="18" fill="#17304a" text-anchor="middle" font-weight="700">Initial</text><path d="M224 270 L270 270" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M280 270 L470 270" stroke="#d8e1e9" stroke-width="2" fill="none"/><path d="M375 175 L375 365" stroke="#d8e1e9" stroke-width="2" fill="none"/><polygon points="357.24871130596426,312 441.24871130596426,312 392.75128869403574,228 308.75128869403574,228" fill="#d9edf8" stroke="#1279b7" stroke-width="2.5"/><text x="375" y="390" font-size="18" fill="#17304a" text-anchor="middle" font-weight="700">Upper shear</text><path d="M474 270 L520 270" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M530 270 L720 270" stroke="#d8e1e9" stroke-width="2" fill="none"/><path d="M625 175 L625 365" stroke="#d8e1e9" stroke-width="2" fill="none"/><polygon points="607.2487113059643,327.3730669589464 691.2487113059643,254.62693304105358 642.7512886940357,212.62693304105358 558.7512886940357,285.3730669589464" fill="#d9edf8" stroke="#1279b7" stroke-width="2.5"/><text x="625" y="390" font-size="18" fill="#17304a" text-anchor="middle" font-weight="700">Lower shear</text><path d="M724 270 L770 270" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 270 L970 270" stroke="#d8e1e9" stroke-width="2" fill="none"/><path d="M875 175 L875 365" stroke="#d8e1e9" stroke-width="2" fill="none"/><polygon points="890.3730669589464,327.3730669589464 932.3730669589464,254.62693304105358 859.6269330410536,212.62693304105358 817.6269330410536,285.3730669589464" fill="#d9edf8" stroke="#1279b7" stroke-width="2.5"/><text x="875" y="390" font-size="18" fill="#17304a" text-anchor="middle" font-weight="700">Upper → rotation</text><text x="500" y="445" font-size="23" fill="#17304a" text-anchor="middle" font-weight="700">U(−tan θ/2) L(sin θ) U(−tan θ/2) = R(θ)</text><text x="500" y="478" font-size="17" fill="#536b82" text-anchor="middle" font-weight="400">At θ = 60°: retained amplitude = 1/2, retained probability = 1/4.</text><text x="35" y="513" font-size="13" fill="#536b82" text-anchor="start" font-weight="400">Exact algebra for the specified construction; physical source and gain selection remain open.</text></g></svg>