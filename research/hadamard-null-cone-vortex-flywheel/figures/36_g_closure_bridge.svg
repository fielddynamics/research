<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="980" height="390"><rect width="980" height="390" fill="#fff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183049;font-size:16px}.small{font-size:13px}.head{font-size:21px;font-weight:bold}</style><text x="25" y="35" class="head">Conditional optical closure normalization</text><text x="25" y="65" class="small">Common reference source and inverse-Laplacian kernel; physical selection of read remains open.</text><rect x="25" y="95" width="420" height="120" rx="8" fill="#e9f1f9" stroke="#6383a3"/><text x="42" y="122" class="head">Electrical reference</text><text x="42" y="151">Single amplitude: t = √α</text><text x="42" y="179">Intensity: α  |  stiffness read: 17</text><rect x="475" y="95" width="480" height="120" rx="8" fill="#e6f4ef" stroke="#418779"/><text x="492" y="122" class="head">Collective gravitational closure</text><text x="492" y="151">1 + 4 + 16 = 21 modes; amplitude t²¹</text><text x="492" y="179">Intensity: α²¹  |  stiffness read: 13</text><path d="M235 215 L235 245 L490 265 M715 215 L715 245 L490 265" fill="none" stroke="#65778b" stroke-width="2"/><rect x="220" y="265" width="540" height="90" rx="8" fill="#f2f4f7" stroke="#65778b"/><text x="490" y="298" text-anchor="middle" class="head">Relative force = (17/13) α²⁰</text><text x="490" y="327" text-anchor="middle">G = (17/13) α²¹ ℏc / mₑ²  (tree level)</text><text x="25" y="378" class="small">Exact conditional identity, not an independently derived microscopic source coupling.</text></svg>