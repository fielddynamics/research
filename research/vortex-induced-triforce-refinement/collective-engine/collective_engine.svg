<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="t d">
<title id="t">One phase vector, two current reads</title><desc id="d">The original collective phase vector supplies eight ring means and twelve core edge currents through a three dimensional map. The same three amplitude coordinates control their strengths.</desc>
<rect width="900" height="410" fill="#fff" rx="12"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#17263c" text-anchor="middle"><text x="450" y="36" font-size="24" font-weight="bold">One collective eight-vortex engine</text>
<rect x="300" y="58" width="300" height="70" rx="9" fill="#eff6ff" stroke="#2563eb"/><text x="450" y="83" font-size="17" font-weight="bold">Collective phase z</text><text x="450" y="109" font-size="15">qᵢ = sᵢ · z;  Σqᵢ = 0</text>
<path d="M450 128 V147 H225 V170 M450 147 H675 V170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="55" y="170" width="340" height="93" rx="9" fill="#eff6ff" stroke="#2563eb"/><text x="225" y="195" font-size="17" font-weight="bold">8 outer vortex rings</text><text x="225" y="220" font-size="15">jₛ = |v|² (s · C) / 16</text><text x="225" y="244" font-size="13">4 paired means, one zero-sum constraint</text>
<rect x="505" y="170" width="340" height="93" rx="9" fill="#f0fdfa" stroke="#0d9488"/><text x="675" y="195" font-size="17" font-weight="bold">12 shared-core bond currents</text><text x="675" y="220" font-size="15">Iᵢⱼ = 3|w|² ((sᵢ × sⱼ) · C) / 64</text><text x="675" y="244" font-size="13">Rank-three divergence-free current image</text>
<path d="M395 215 H505" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="450" y="202" font-size="12">γD</text>
<rect x="130" y="310" width="640" height="67" rx="9" fill="#f8fafc" stroke="#64748b"/><text x="450" y="334" font-size="17" font-weight="bold">Unchanged Stage VII Hamiltonian</text><text x="450" y="357" font-size="15">m = u − v/3 (row mean) · v (winding) · w (core)</text><path d="M225 310 V263 M675 310 V263" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/></g></svg>
