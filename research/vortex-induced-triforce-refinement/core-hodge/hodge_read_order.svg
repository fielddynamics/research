<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="440" viewBox="0 0 1050 440" role="img" aria-labelledby="title desc"><title id="title">Core current accounting and aggregation order</title><desc id="desc">Fine currents split into divergence-associated and circulation components. Circulation splits into five visible and twelve hidden directions. Coarse projection after aggregation is contaminated by fine gradients.</desc><rect width="1050" height="440" fill="#fff"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#60758a"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" fill="#203247" text-anchor="middle"><text x="525" y="36" font-size="24" font-weight="bold">Separate circulation before aggregating the core read</text><g stroke="#60758a" stroke-width="1.8" fill="none" marker-end="url(#arr)"><path d="M205 127 H280 V95 H332"/><path d="M205 127 H280 V207 H332"/><path d="M527 207 H570 V168 H630"/><path d="M527 207 H570 V259 H630"/><path d="M822 168 H900 V127"/><path d="M205 148 V349 H630" stroke-dasharray="6 4"/><path d="M822 349 H948 V148" stroke-dasharray="6 4"/></g><g stroke-width="1.3"><rect x="25" y="95" width="180" height="64" rx="10" fill="#edf3f8" stroke="#54769a"/><rect x="332" y="62" width="195" height="66" rx="10" fill="#fbf0de" stroke="#c08234"/><rect x="332" y="174" width="195" height="66" rx="10" fill="#e6f4f1" stroke="#168475"/><rect x="630" y="135" width="192" height="66" rx="10" fill="#e6f4f1" stroke="#168475"/><rect x="630" y="226" width="192" height="66" rx="10" fill="#e6f4f1" stroke="#168475"/><rect x="865" y="70" width="165" height="78" rx="10" fill="#edf3f8" stroke="#54769a"/><rect x="630" y="316" width="192" height="66" rx="10" fill="#fbf0de" stroke="#c08234"/></g><g font-size="15" font-weight="bold"><text x="115" y="122">48 fine core currents</text><text x="429" y="88">31 gradient directions</text><text x="429" y="201">17 cycle directions</text><text x="726" y="162">5 visible cycles</text><text x="726" y="253">12 hidden cycles</text><text x="947" y="98">5 coarse cycles</text><text x="726" y="343">Aggregate first</text></g><g font-size="13"><text x="115" y="141">I</text><text x="429" y="109">Divergence-associated</text><text x="429" y="222">Divergence-free</text><text x="726" y="183">Minimum-norm lift</text><text x="726" y="274">Zero aggregate current</text><text x="947" y="117">R P_f I</text><text x="947" y="133">Faithful cycle read</text><text x="726" y="363">P_c R I: contaminated</text><text x="525" y="415" fill="#985d16">Dashed path differs by a rank-five operator; coarse cycles can be mimicked by fine gradients.</text></g></g></svg>
