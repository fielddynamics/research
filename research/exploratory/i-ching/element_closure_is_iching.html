<!DOCTYPE html>

<title>GFD Element Closure Map — 83 Stable Elements</title>
<style>

* { margin:0; padding:0; box-sizing:border-box; }

body {

header {

}

header .sub {
  font-size: 0.5rem;
  color: var(--dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-top: 0.2rem;
}

.app {
  display: flex;

}

/* ─── Periodic Table Sidebar ─── */
.periodic-sidebar {

}

.periodic-sidebar .search-bar {

}

}

.periodic-sidebar input:focus { border-color: var(--cyan); }

.element-grid {

  flex-wrap: wrap;
  gap: 2px;
  align-content: flex-start;
}

.element-cell {

  height: 38px;

  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.12s;
  border: 1px solid transparent;
  position: relative;
}

.element-cell:hover { border-color: var(--cyan); transform: scale(1.08); z-index: 2; }
.element-cell.selected { border-color: var(--gold); background: rgba(212,160,0,0.08) !important; }

.element-cell .z { font-size: 0.4rem; color: var(--dim); line-height: 1; }
.element-cell .sym { font-size: 0.7rem; font-weight: 600; line-height: 1.1; }
.element-cell .score-dot {
  width: 4px; height: 4px; border-radius: 50%;

}

/* ─── Main Detail Panel ─── */

  flex-direction: column;
  overflow-y: auto;
  padding: 1rem;

}

.detail-header {

<body>

<header>
  <h1>GFD Element Closure Map</h1>
  <div class="sub">Walk-order Sierpiński fill &middot; 83 stable elements &middot; 3-cycle field closure at n/4</div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════

const ELEMENTS = [

  {Z:43,sym:"Tc",name:"Technetium",A:98},{Z:44,sym:"Ru",name:"Ruthenium",A:102},
  {Z:45,sym:"Rh",name:"Rhodium",A:103},{Z:46,sym:"Pd",name:"Palladium",A:106},
  {Z:47,sym:"Ag",name:"Silver",A:107},{Z:48,sym:"Cd",name:"Cadmium",A:114},
  {Z:49,sym:"In",name:"Indium",A:115},{Z:50,sym:"Sn",name:"Tin",A:120},
  {Z:51,sym:"Sb",name:"Antimony",A:121},{Z:52,sym:"Te",name:"Tellurium",A:130},
  {Z:53,sym:"I",name:"Iodine",A:127},{Z:54,sym:"Xe",name:"Xenon",A:132},
  {Z:55,sym:"Cs",name:"Caesium",A:133},{Z:56,sym:"Ba",name:"Barium",A:138},
  {Z:57,sym:"La",name:"Lanthanum",A:139},{Z:58,sym:"Ce",name:"Cerium",A:140},
  {Z:59,sym:"Pr",name:"Praseodymium",A:141},{Z:60,sym:"Nd",name:"Neodymium",A:142},
  {Z:61,sym:"Pm",name:"Promethium",A:145},{Z:62,sym:"Sm",name:"Samarium",A:152},
  {Z:63,sym:"Eu",name:"Europium",A:153},{Z:64,sym:"Gd",name:"Gadolinium",A:158},
  {Z:65,sym:"Tb",name:"Terbium",A:159},{Z:66,sym:"Dy",name:"Dysprosium",A:164},
  {Z:67,sym:"Ho",name:"Holmium",A:165},{Z:68,sym:"Er",name:"Erbium",A:166},
  {Z:69,sym:"Tm",name:"Thulium",A:169},{Z:70,sym:"Yb",name:"Ytterbium",A:174},
  {Z:71,sym:"Lu",name:"Lutetium",A:175},{Z:72,sym:"Hf",name:"Hafnium",A:180},
  {Z:73,sym:"Ta",name:"Tantalum",A:181},{Z:74,sym:"W",name:"Tungsten",A:184},
  {Z:75,sym:"Re",name:"Rhenium",A:187},{Z:76,sym:"Os",name:"Osmium",A:192},
  {Z:77,sym:"Ir",name:"Iridium",A:193},{Z:78,sym:"Pt",name:"Platinum",A:195},
  {Z:79,sym:"Au",name:"Gold",A:197},{Z:80,sym:"Hg",name:"Mercury",A:202},
  {Z:81,sym:"Tl",name:"Thallium",A:205},{Z:82,sym:"Pb",name:"Lead",A:208},
  {Z:83,sym:"Bi",name:"Bismuth",A:209}
];

const MAGIC_A = new Set([2, 8, 20, 28, 50, 82, 126, 184]);
const NOBLE_Z = new Set([2, 10, 18, 36, 54]);

// Known B/A (MeV/nucleon)
const KNOWN_BA = {
  1:0.000,2:7.074,3:5.332,4:6.463,5:6.928,6:7.680,7:7.476,8:7.976,9:6.258,10:8.032,
  11:8.114,12:8.261,13:8.332,14:8.448,15:8.481,16:8.520,17:8.521,18:8.595,19:8.557,20:8.551,
  21:8.619,22:8.660,23:8.683,24:8.720,25:8.702,26:8.790,27:8.745,28:8.732,29:8.752,30:8.756,
  31:8.715,32:8.727,33:8.719,34:8.710,35:8.696,36:8.717,37:8.690,38:8.695,39:8.668,40:8.671,
  41:8.645,42:8.642,43:8.616,44:8.607,45:8.586,46:8.570,47:8.553,48:8.540,49:8.514,50:8.504,
  51:8.484,52:8.470,53:8.445,54:8.428,55:8.404,56:8.393,57:8.372,58:8.361,59:8.340,60:8.331,
  61:8.310,62:8.303,63:8.283,64:8.275,65:8.252,66:8.246,67:8.229,68:8.218,69:8.199,70:8.195,
  71:8.173,72:8.166,73:8.149,74:8.146,75:8.130,76:8.126,77:8.110,78:8.105,79:8.088,80:8.083,
  81:8.063,82:8.058,83:8.041
};

function computeBindingEnergy(A, Z, score) {
  // Pure closure: B/A = score × D/(D+K) × (A-1)/A
  // D/(D+K) = 3/7 — the tetrahedral coupling fraction
  // (A-1)/A = pair counting (first nucleon has nothing to bind to)
  // score = walk closure (18-21)
  // At Fe (A=56, score=21): 21 × 3/7 × 55/56 = 8.84 MeV/A
  const D = 3, K = 4;
  const couplingFrac = D / (D + K); // = 3/7
  const pairFrac = A > 1 ? (A - 1) / A : 0;
  const BA = score * couplingFrac * pairFrac;
  return { BA, couplingFrac, pairFrac };
}

// ═══════════════════════════════════════════════════════════
// WALK ENGINE
// ═══════════════════════════════════════════════════════════

// Build 64-step walk order: corners[0,1,2] then gate[3] at each level
const walkOrder = [];
for (let fi = 0; fi < 4; fi++)
  for (let ci = 0; ci < 4; ci++)
    for (let si = 0; si < 4; si++)
      walkOrder.push({fi, ci, si, gd: (fi===3?1:0)+(ci===3?1:0)+(si===3?1:0)});

function computeClosure(A) {
  let a64 = A > 64 ? A % 64 : A;
  if (a64 === 0) a64 = 64;

  // Fill face state: (fi,ci) → count of subs filled
  const state = {};
  for (let fi=0;fi<4;fi++) for (let ci=0;ci<4;ci++) state[fi*4+ci] = 0;
  for (let s = 0; s < a64; s++) {
    const w = walkOrder[s];
    state[w.fi*4+w.ci]++;
  }

  // Cycle 1: faces occupied
  const faceContent = [0,0,0,0];
  for (let fi=0;fi<4;fi++) for (let ci=0;ci<4;ci++) faceContent[fi] += state[fi*4+ci];
  const nFaces = faceContent.filter(x=>x>0).length;

  // Cycle 2: channels per face
  const chanOcc = [0,0,0,0];
  for (let fi=0;fi<4;fi++) {
    for (let ci=0;ci<4;ci++) if (state[fi*4+ci]>0) chanOcc[fi]++;
  }

  // Cycle 3: sub count per channel
  const subCounts = [];
  for (let fi=0;fi<4;fi++) for (let ci=0;ci<4;ci++) subCounts.push(state[fi*4+ci]);

  const isLm = n => n===0||n===2||n===4;
  const c1Lm = isLm(nFaces);
  const c2Lm = chanOcc.filter(isLm).length;
  const c3Lm = subCounts.filter(isLm).length;
  const score = (c1Lm?1:0) + c2Lm + c3Lm;

  // Walk position trace
  const lastStep = a64 > 0 ? walkOrder[a64-1] : null;
  const gateDepthLast = lastStep ? lastStep.gd : 0;

  // Gate depth distribution
  let gd0=0,gd1=0,gd2=0,gd3=0;
  for (let s=0;s<a64;s++) {
    const g = walkOrder[s].gd;
    if(g===0) gd0++; else if(g===1) gd1++; else if(g===2) gd2++; else gd3++;
  }

  return {
    a64, state, nFaces, faceContent, chanOcc, subCounts,
    c1Lm, c2Lm, c3Lm, score,
    lastStep, gateDepthLast,
    gd: [gd0,gd1,gd2,gd3]
  };
}

function scoreColor(s) {
  if (s >= 21) return 'var(--gold)';
  if (s >= 20) return 'var(--cyan)';
  if (s >= 19) return 'var(--blue)';
  return 'var(--dim)';
}

function scoreBg(s) {
  if (s >= 21) return 'rgba(212,160,0,0.08)';
  if (s >= 20) return 'rgba(0,221,184,0.06)';
  if (s >= 19) return 'rgba(72,136,216,0.05)';
  return 'var(--bg3)';
}

// ═══════════════════════════════════════════════════════════
// SIERPINSKI DRAWING
// ═══════════════════════════════════════════════════════════

function drawSierpinski(canvas, a64) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  const pad = 12;
  const side = W - pad*2;
  const th = side * Math.sqrt(3)/2;
  const T0 = {x:W/2, y:pad+4};
  const T1 = {x:pad, y:pad+4+th};
  const T2 = {x:W-pad, y:pad+4+th};

  function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
  function subdiv(p0,p1,p2,up){
    const m01=mid(p0,p1),m12=mid(p1,p2),m20=mid(p2,p0);
    if(up) return [
      {pts:[p0,m01,m20],up:true,role:'corner'},
      {pts:[m01,p1,m12],up:true,role:'corner'},
      {pts:[m20,m12,p2],up:true,role:'corner'},
      {pts:[m01,m12,m20],up:false,role:'gate'}
    ]; else return [
      {pts:[p0,m01,m20],up:false,role:'corner'},
      {pts:[m01,p1,m12],up:false,role:'corner'},
      {pts:[m20,m12,p2],up:false,role:'corner'},
      {pts:[m01,m12,m20],up:true,role:'gate'}
    ];
  }

  const faces = subdiv(T0,T1,T2,true);
  let allTris = [];
  faces.forEach((face,fi) => {
    const chans = subdiv(face.pts[0],face.pts[1],face.pts[2],face.up);
    chans.forEach((chan,ci) => {
      const subs = subdiv(chan.pts[0],chan.pts[1],chan.pts[2],chan.up);
      subs.forEach((sub,si) => {
        allTris.push({pts:sub.pts, fi, ci, si,
          gd:(fi===3?1:0)+(ci===3?1:0)+(si===3?1:0)});
      });
    });
  });

  // Map walk order to triangle indices
  const triMap = {};
  allTris.forEach((t,idx) => { triMap[t.fi*16+t.ci*4+t.si] = idx; });

  // Draw
  const filledSet = new Set();
  for (let s=0; s<a64; s++) {
    const w = walkOrder[s];
    filledSet.add(w.fi*16+w.ci*4+w.si);
  }

  allTris.forEach((tri) => {
    const key = tri.fi*16+tri.ci*4+tri.si;
    const filled = filledSet.has(key);
    ctx.beginPath();
    ctx.moveTo(tri.pts[0].x, tri.pts[0].y);
    ctx.lineTo(tri.pts[1].x, tri.pts[1].y);
    ctx.lineTo(tri.pts[2].x, tri.pts[2].y);
    ctx.closePath();

    if (filled) {
      if (tri.gd===0) { ctx.fillStyle='rgba(0,221,184,0.5)'; ctx.strokeStyle='rgba(0,221,184,0.6)'; }
      else if (tri.gd===1) { ctx.fillStyle='rgba(72,136,216,0.45)'; ctx.strokeStyle='rgba(72,136,216,0.5)'; }
      else if (tri.gd===2) { ctx.fillStyle='rgba(208,72,120,0.4)'; ctx.strokeStyle='rgba(208,72,120,0.5)'; }
      else { ctx.fillStyle='rgba(208,72,120,0.65)'; ctx.strokeStyle='rgba(208,72,120,0.8)'; }
    } else {
      ctx.fillStyle = tri.gd > 0 ? 'rgba(208,72,120,0.03)' : '#090b10';
      ctx.strokeStyle = '#12151e';
    }
    ctx.fill();
    ctx.lineWidth = 0.5;
    ctx.stroke();
  });

  // Face boundaries
  faces.forEach(f => {
    ctx.beginPath();
    ctx.moveTo(f.pts[0].x,f.pts[0].y);
    ctx.lineTo(f.pts[1].x,f.pts[1].y);
    ctx.lineTo(f.pts[2].x,f.pts[2].y);
    ctx.closePath();
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });
}

// BUILD ELEMENT GRID
// ═══════════════════════════════════════════════════════════

let selectedZ = null;
const grid = document.getElementById('elementGrid');

function buildGrid(filter) {
  grid.innerHTML = '';
  const filt = (filter||'').toLowerCase();
  
  ELEMENTS.forEach(el => {
    if (filt && !el.sym.toLowerCase().includes(filt) && 
        !el.name.toLowerCase().includes(filt) && 
        !String(el.Z).includes(filt)) return;
    
    const cl = computeClosure(el.A);
    const cell = document.createElement('div');
    cell.className = 'element-cell' + (selectedZ === el.Z ? ' selected' : '');
    cell.style.background = scoreBg(cl.score);
    
    const sc = scoreColor(cl.score);
    cell.innerHTML = `
      <span class="z">${el.Z}</span>
      <span class="sym" style="color:${sc}">${el.sym}</span>
      <span class="score-dot" style="background:${sc}"></span>
    `;
    
    if (MAGIC_A.has(el.A)) {
      cell.style.boxShadow = 'inset 0 0 0 1px rgba(212,160,0,0.3)';
    }
    
    cell.addEventListener('click', () => selectElement(el.Z));
    grid.appendChild(cell);
  });
}

document.getElementById('search').addEventListener('input', e => buildGrid(e.target.value));

// ═══════════════════════════════════════════════════════════
// GRAPH OVERLAY
// ═══════════════════════════════════════════════════════════

let graphVisible = false;

function toggleGraph() {
  graphVisible = !graphVisible;
  const overlay = document.getElementById('graphOverlay');
  if (graphVisible) {
    overlay.classList.add('visible');
    drawGraph();
  } else {
    overlay.classList.remove('visible');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && graphVisible) toggleGraph();
});

function drawGraph() {
  const canvas = document.getElementById('graphCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  
  // Background
  ctx.fillStyle = '#080a10';
  ctx.fillRect(0, 0, W, H);
  
  // Margins
  const ml = 55, mr = 20, mt = 20, mb = 50;
  const pw = W - ml - mr, ph = H - mt - mb;
  
  // Compute all B/A values
  const data = ELEMENTS.map(el => {
    const cl = computeClosure(el.A);
    const be = computeBindingEnergy(el.A, el.Z, cl.score);
    const known = KNOWN_BA[el.Z] || 0;
    return { ...el, score: cl.score, ba_gfd: be.BA, ba_known: known, delta: be.BA - known };
  });
  
  // Axes
  const maxA = 220, minBA = 0, maxBA = 10;
  
  function px(A) { return ml + (A / maxA) * pw; }
  function py(ba) { return mt + (1 - (ba - minBA) / (maxBA - minBA)) * ph; }
  
  // Grid lines
  ctx.strokeStyle = '#141828';
  ctx.lineWidth = 0.5;
  for (let ba = 0; ba <= 10; ba += 2) {
    ctx.beginPath();
    ctx.moveTo(ml, py(ba));
    ctx.lineTo(ml + pw, py(ba));
    ctx.stroke();
    
    ctx.fillStyle = '#303850';
    ctx.font = '9px "IBM Plex Mono"';
    ctx.textAlign = 'right';
    ctx.fillText(ba.toFixed(0), ml - 8, py(ba) + 3);
  }
  
  for (let a = 0; a <= 210; a += 50) {
    ctx.beginPath();
    ctx.moveTo(px(a), mt);
    ctx.lineTo(px(a), mt + ph);
    ctx.stroke();
    
    ctx.fillStyle = '#303850';
    ctx.textAlign = 'center';
    ctx.fillText(a, px(a), mt + ph + 16);
  }
  
  // Axis labels
  ctx.fillStyle = '#505870';
  ctx.font = '500 9px "IBM Plex Mono"';
  ctx.textAlign = 'center';
  ctx.fillText('Mass Number A', ml + pw/2, H - 8);
  
  ctx.save();
  ctx.translate(14, mt + ph/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('B/A (MeV/nucleon)', 0, 0);
  ctx.restore();
  
  // Shell boundaries
  [64, 128, 192].forEach(a => {
    ctx.strokeStyle = 'rgba(212,160,0,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(px(a), mt);
    ctx.lineTo(px(a), mt + ph);
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.fillStyle = 'rgba(212,160,0,0.3)';
    ctx.font = '8px "IBM Plex Mono"';
    ctx.textAlign = 'center';
    ctx.fillText('Shell', px(a), mt + 12);
  });
  
  // Draw known curve (dim, behind)
  ctx.beginPath();
  ctx.strokeStyle = '#353d54';
  ctx.lineWidth = 1.5;
  let first = true;
  data.forEach(d => {
    if (d.ba_known <= 0) return;
    const x = px(d.A), y = py(d.ba_known);
    if (first) { ctx.moveTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Draw known points
  data.forEach(d => {
    if (d.ba_known <= 0) return;
    const x = px(d.A), y = py(d.ba_known);
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI*2);
    ctx.fillStyle = '#353d54';
    ctx.fill();
  });
  
  // Draw GFD curve
  ctx.beginPath();
  ctx.strokeStyle = '#00ddb8';
  ctx.lineWidth = 1.5;
  first = true;
  data.forEach(d => {
    if (d.ba_gfd <= 0) return;
    const x = px(d.A), y = py(d.ba_gfd);
    if (first) { ctx.moveTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Draw GFD points with special markers
  data.forEach(d => {
    if (d.ba_gfd <= 0) return;
    const x = px(d.A), y = py(d.ba_gfd);
    
    let color = '#00ddb8';
    let r = 2.5;
    
    if (d.score === 21) { color = '#d04878'; r = 4; }
    else if (MAGIC_A.has(d.A)) { color = '#d4a000'; r = 3.5; }
    
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    
    // Label magic numbers and perfect closure
    if (MAGIC_A.has(d.A) || d.score === 21) {
      ctx.fillStyle = color;
      ctx.font = '500 7px "IBM Plex Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(d.sym, x, y - r - 3);
    }
  });
  
  // Highlight selected element
  if (selectedZ) {
    const sel = data.find(d => d.Z === selectedZ);
    if (sel && sel.ba_gfd > 0) {
      const x = px(sel.A), y = py(sel.ba_gfd);
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI*2);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 9px "IBM Plex Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(sel.sym, x, y - 10);
    }
  }
  
  // Compute stats
  let sumAbsErr = 0, sumSqErr = 0, maxErr = 0, count = 0;
  data.forEach(d => {
    if (d.ba_known > 0 && d.ba_gfd > 0) {
      const err = Math.abs(d.delta);
      sumAbsErr += err;
      sumSqErr += err * err;
      if (err > maxErr) maxErr = err;
      count++;
    }
  });
  
  const mae = sumAbsErr / count;
  const rmse = Math.sqrt(sumSqErr / count);
  
  // Score-grouped averages
  const scoreGroups = {};
  data.forEach(d => {
    if (!scoreGroups[d.score]) scoreGroups[d.score] = { sum: 0, count: 0 };
    if (d.ba_known > 0) {
      scoreGroups[d.score].sum += Math.abs(d.delta);
      scoreGroups[d.score].count++;
    }
  });
  
  const statsDiv = document.getElementById('graphStats');
  statsDiv.innerHTML = `
    <div class="stat">
      <div class="stat-val" style="color:var(--cyan)">${mae.toFixed(3)}</div>
      <div class="stat-label">MAE (MeV/n)</div>
    </div>
    <div class="stat">
      <div class="stat-val" style="color:var(--blue)">${rmse.toFixed(3)}</div>
      <div class="stat-label">RMSE (MeV/n)</div>
    </div>
    <div class="stat">
      <div class="stat-val" style="color:var(--rose)">${maxErr.toFixed(3)}</div>
      <div class="stat-label">Max Error</div>
    </div>
    <div class="stat">
      <div class="stat-val" style="color:var(--bright)">${count}</div>
      <div class="stat-label">Elements</div>
    </div>
    ${Object.keys(scoreGroups).sort((a,b)=>b-a).map(s => {
      const g = scoreGroups[s];
      const avg = g.count > 0 ? (g.sum/g.count).toFixed(3) : '—';
      const col = s == 21 ? 'var(--gold)' : s == 20 ? 'var(--cyan)' : s == 19 ? 'var(--blue)' : 'var(--dim)';
      return `<div class="stat">
        <div class="stat-val" style="color:${col}">${avg}</div>
        <div class="stat-label">Score ${s} MAE</div>
      </div>`;
    }).join('')}
  `;
}
