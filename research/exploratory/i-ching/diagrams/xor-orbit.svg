<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-label="The order-three read">
<rect x="1" y="1" width="958" height="363" rx="18" fill="#101c2c" stroke="#354c65"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a9b9c9"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="38" fill="#edf2f8" font-size="25" text-anchor="start" font-weight="700">The order-three read</text>
<text x="30" y="63" fill="#a9b9c9" font-size="14" text-anchor="start">R(a,b) = (b, a XOR b)</text>
<rect x="40" y="104" width="240" height="75" rx="10" fill="#1b3045" stroke="#61e0bd"/>
<text x="160.0" y="134" fill="#61e0bd" font-size="19" text-anchor="middle" font-weight="700">(a, b)</text>
<text x="160.0" y="157" fill="#a9b9c9" font-size="13" text-anchor="middle">(1, 2)</text>
<rect x="360" y="104" width="240" height="75" rx="10" fill="#1b3045" stroke="#61e0bd"/>
<text x="480.0" y="134" fill="#61e0bd" font-size="19" text-anchor="middle" font-weight="700">(b, a XOR b)</text>
<text x="480.0" y="157" fill="#a9b9c9" font-size="13" text-anchor="middle">(2, 3)</text>
<rect x="680" y="104" width="240" height="75" rx="10" fill="#1b3045" stroke="#61e0bd"/>
<text x="800.0" y="134" fill="#61e0bd" font-size="19" text-anchor="middle" font-weight="700">(a XOR b, a)</text>
<text x="800.0" y="157" fill="#a9b9c9" font-size="13" text-anchor="middle">(3, 1)</text>
<line x1="280" y1="142" x2="356" y2="142" stroke="#a9b9c9" stroke-width="2" marker-end="url(#arr)"/>
<line x1="600" y1="142" x2="676" y2="142" stroke="#a9b9c9" stroke-width="2" marker-end="url(#arr)"/>
<line x1="800" y1="180" x2="800" y2="211" stroke="#a9b9c9" stroke-width="2"/>
<line x1="800" y1="211" x2="160" y2="211" stroke="#a9b9c9" stroke-width="2"/>
<line x1="160" y1="211" x2="160" y2="182" stroke="#a9b9c9" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="265" fill="#61e0bd" font-size="35" text-anchor="middle" font-weight="700">64 = 1 + 3 × 21</text>
<text x="480" y="293" fill="#a9b9c9" font-size="16" text-anchor="middle">1 fixed zero address + 21 nonzero three-element orbits</text>
<text x="30" y="345" fill="#a9b9c9" font-size="13" text-anchor="start">Each nonzero orbit is a projective point in PG(2,4).</text>
</g></svg>