<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590"><rect width="900" height="590" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#193047"><text x="30" y="38" font-size="25" font-weight="bold">Shared-zone hexagram read</text><text x="30" y="65" font-size="15">Exact counts; physical read selection remains open</text><g font-size="17" text-anchor="middle"><rect x="30" y="90" width="315" height="65" rx="5" fill="#c9dff2"/><rect x="345" y="90" width="210" height="65" rx="5" fill="#eed9ae"/><rect x="555" y="90" width="315" height="65" rx="5" fill="#dccfee"/><text x="187" y="117">24 · Hamming 1</text><text x="450" y="117">16 · shared</text><text x="712" y="117">24 · Hamming 2</text><text x="450" y="141" font-size="13">equal or complementary</text><path d="M450 155 V194" stroke="#193047" stroke-width="2"/><text x="450" y="215" font-weight="bold">Three cyclic reads: 12 + 12 + 12 + 4 = 40</text><g fill="#c9dff2" stroke="#386a9a"><rect x="80" y="245" width="215" height="60" rx="6"/><rect x="342" y="245" width="215" height="60" rx="6"/><rect x="605" y="245" width="215" height="60" rx="6"/></g><text x="187" y="280">c in {0,u}: 12 exclusive</text><text x="450" y="280">a in {0,u}: 12 exclusive</text><text x="712" y="280">b in {0,u}: 12 exclusive</text><path d="M187 305 V324 H712 V305 M450 305 V338" fill="none" stroke="#386a9a" stroke-width="2"/><rect x="340" y="338" width="220" height="38" rx="5" fill="#eed9ae"/><text x="450" y="362">4 shared by all three</text><path d="M450 376 V407" stroke="#193047" stroke-width="2"/><rect x="60" y="412" width="410" height="72" rx="6" fill="#c9dff2"/><rect x="490" y="412" width="350" height="72" rx="6" fill="#dccfee"/><text x="265" y="439" font-weight="bold">13 inside directions</text><text x="265" y="463">(40 − 1) / 3</text><text x="665" y="439" font-weight="bold">8 outside directions</text><text x="665" y="463">4 opposite-orientation pairs</text><text x="450" y="523" font-size="20" font-weight="bold">Partial orientation quotient: 13 + 4 = 17</text><text x="450" y="553" font-size="15">Nested candidate ranks 17 and 13; not the earlier pencil/Baer operators.</text></g></g></svg>