<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18324b"><text x="30" y="40" font-size="25" font-weight="bold">Two exact averaging laws — distinct domains</text><text x="30" y="67" font-size="14" font-weight="normal">Conditional on the complete signed shift and linear relabeling symmetry.</text><rect x="30" y="94" width="330" height="215" rx="8" fill="white" stroke="#4079a9" stroke-width="2"/><rect x="390" y="94" width="360" height="215" rx="8" fill="white" stroke="#cb913d" stroke-width="2"/><text x="48" y="123" font-size="18" font-weight="bold">28 × 28 channel covariance</text><text x="48" y="155" font-size="16" font-weight="normal">Signed shift / phase twirl</text><text x="48" y="183" font-size="15" font-weight="normal">↓  kills off-diagonal entries</text><text x="48" y="212" font-size="16" font-weight="normal">GL(3,2) relabeling</text><text x="48" y="241" font-size="15" font-weight="normal">↓  equalizes all 28 diagonal entries</text><text x="48" y="279" font-size="22" font-weight="bold">tr(C) I / 28</text><text x="408" y="123" font-size="18" font-weight="bold">8 × 8 trigram operator</text><text x="408" y="155" font-size="16" font-weight="normal">Average skew conjugation</text><text x="408" y="184" font-size="19" font-weight="bold">Φ(X) = (tr(X) I − Xᵀ) / 7</text><text x="408" y="220" font-size="16" font-weight="normal">1        common mode (1)</text><text x="408" y="250" font-size="16" font-weight="normal">−1/7   symmetric traceless (35)</text><text x="408" y="280" font-size="16" font-weight="normal">+1/7   skew (28)</text><text x="30" y="345" font-size="17" font-weight="bold">Marked Heaven–Earth symmetry alone allows unequal channel weights.</text><text x="30" y="374" font-size="15" font-weight="normal">Neither average derives the physical gain or the additive inverse-action law.</text></g></svg>