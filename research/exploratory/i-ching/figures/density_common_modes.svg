<svg xmlns="http://www.w3.org/2000/svg" width="940" height="475" viewBox="0 0 940 475"><rect width="940" height="475" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#172b40"><text x="35" y="44" font-size="25" font-weight="bold">The physical trace and Walsh common mode are different lines</text><text x="35" y="73" font-size="15">Two-dimensional section of the invariant 22-dimensional register</text><g stroke="#477aa6" stroke-width="3"><path d="M90 330 H375"/><path d="M210 400 V112" stroke-dasharray="8 7"/></g><g stroke="#b88a3e" stroke-width="3"><path d="M210 330 L330.5 145.9"/><path d="M80 245 L340 415" stroke-dasharray="8 7"/></g><path d="M250 330 A40 40 0 0 0 232 297" fill="none" stroke="#526577" stroke-width="1.5"/><circle cx="210" cy="330" r="5" fill="#172b40"/><text x="385" y="335" font-size="17" fill="#477aa6">e (trace)</text><text x="338" y="145" font-size="17" fill="#9c722e">f (Walsh seed)</text><text x="220" y="116" font-size="16" fill="#477aa6">e⊥</text><text x="43" y="240" font-size="16" fill="#9c722e">f⊥</text><text x="248" y="301" font-size="15">cos² θ = 3/10</text><rect x="480" y="125" width="420" height="266" rx="12" fill="#e8eef3"/><text x="502" y="158" font-size="19" font-weight="bold">Two different 21-dimensional spaces</text><text x="502" y="196" font-size="17">Orthogonal projection e⊥ → f⊥</text><text x="502" y="229" font-size="17">Singular values: 1 (20), √(3/10) (1)</text><text x="502" y="270" font-size="17">Induced metric: I + (7/3) vvᵀ</text><text x="502" y="309" font-size="17">Ranks: 17 and 13 in either space</text><text x="502" y="347" font-size="16">Weighted-trace prescription need not agree.</text><text x="35" y="448" font-size="15">Ordinary operator traces are coordinate invariant; metric-weighted observables require a specified physical law.</text></g></svg>