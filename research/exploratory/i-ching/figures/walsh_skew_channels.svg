="171" width="30" height="30" rx="3" fill="#4079a9"/><rect x="35" y="204" width="30" height="30" rx="3" fill="#cb913d"/><rect x="68" y="204" width="30" height="30" rx="3" fill="#cb913d"/><rect x="101" y="204" width="30" height="30" rx="3" fill="#cb913d"/><rect x="134" y="204" width="30" height="30" rx="3" fill="#a6bfd5"/><rect x="167" y="204" width="30" height="30" rx="3" fill="#4079a9"/><rect x="200" y="204" width="30" height="30" rx="3" fill="#4079a9"/><rect x="233" y="204" width="30" height="30" rx="3" fill="#4079a9"/><rect x="266" y="204" width="30" height="30" rx="3" fill="#4079a9"/><rect x="35" y="237" width="30" height="30" rx="3" fill="#cb913d"/><rect x="68" y="237" width="30" height="30" rx="3" fill="#cb913d"/><rect x="101" y="237" width="30" height="30" rx="3" fill="#cb913d"/><rect x="134" y="237" width="30" height="30" rx="3" fill="#cb913d"/><rect x="167" y="237" width="30" height="30" rx="3" fill="#a6bfd5"/><rect x="200" y="237" width="30" height="30" rx="3" fill="#4079a9"/><rect x="233" y="237" width="30" height="30" rx="3" fill="#4079a9"/><rect x="266" y="237" width="30" height="30" rx="3" fill="#4079a9"/><rect x="35" y="270" width="30" height="30" rx="3" fill="#cb913d"/><rect x="68" y="270" width="30" height="30" rx="3" fill="#cb913d"/><rect x="101" y="270" width="30" height="30" rx="3" fill="#cb913d"/><rect x="134" y="270" width="30" height="30" rx="3" fill="#cb913d"/><rect x="167" y="270" width="30" height="30" rx="3" fill="#cb913d"/><rect x="200" y="270" width="30" height="30" rx="3" fill="#a6bfd5"/><rect x="233" y="270" width="30" height="30" rx="3" fill="#4079a9"/><rect x="266" y="270" width="30" height="30" rx="3" fill="#4079a9"/><rect x="35" y="303" width="30" height="30" rx="3" fill="#cb913d"/><rect x="68" y="303" width="30" height="30" rx="3" fill="#cb913d"/><rect x="101" y="303" width="30" height="30" rx="3" fill="#cb913d"/><rect x="134" y="303" width="30" height="30" rx="3" fill="#cb913d"/><rect x="167" y="303" width="30" height="30" rx="3"