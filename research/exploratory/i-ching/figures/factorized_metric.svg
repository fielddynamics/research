<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18324d" text-anchor="middle"><text x="450" y="40" font-size="25" font-weight="bold">Factorized-metric theorem</text><text x="450" y="66" font-size="15">Conditional bridge to two chamber read records</text><rect x="45" y="96" width="330" height="74" rx="8" fill="#e0eaf5" stroke="#386f9e"/><rect x="525" y="96" width="330" height="74" rx="8" fill="#eee7f4" stroke="#78659a"/><text x="210" y="124" font-size="19">First chamber: h &gt; 0</text><text x="210" y="150" font-size="15">Independent address metric</text><text x="690" y="124" font-size="19">Second chamber: k &gt; 0</text><text x="690" y="150" font-size="15">Independent address metric</text><path d="M210 170 V191 H450 M690 170 V191 H450 V207" stroke="#617489" stroke-width="2" fill="none"/><rect x="230" y="207" width="440" height="76" rx="8" fill="#e8edf3"/><text x="450" y="237" font-size="20">h ⊗ k, invariant under XOR read</text><text x="450" y="263" font-size="17">(a,b) → (b,a⊕b)</text><path d="M450 283 V307" stroke="#617489" stroke-width="2"/><rect x="230" y="307" width="440" height="62" rx="8" fill="#386f9e"/><text x="450" y="345" font-size="22" font-weight="bold" fill="white">h = c I, k = d I</text><text x="450" y="405" font-size="15">Exact theorem under the two assumptions; native factorization is not yet established.</text></g></svg>
