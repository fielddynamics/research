<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410"><rect width="900" height="410" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18324d"><text x="32" y="44" font-size="25" font-weight="bold">Read-algebra metric rigidity</text><text x="32" y="72" font-size="15">21 contrast directions; common line already removed</text><rect x="32" y="104" width="532" height="73" rx="8" fill="#386f9e"/><rect x="564" y="104" width="266" height="73" rx="8" fill="#78659a"/><g fill="white" text-anchor="middle"><text x="298" y="134" font-size="23" font-weight="bold">14 even</text><text x="298" y="158" font-size="16">common weight a</text><text x="697" y="134" font-size="23" font-weight="bold">7 odd</text><text x="697" y="158" font-size="16">common weight b</text></g><text x="32" y="218" font-size="19">Positive read: 14a + 3b</text><text x="32" y="254" font-size="19">Signed read: 14a − b</text><text x="32" y="290" font-size="19">Shared-zone read: 10a + 3b</text><rect x="465" y="204" width="365" height="116" rx="10" fill="#e8edf3"/><text x="647" y="235" font-size="18" text-anchor="middle">Equal work scale a = b</text><text x="647" y="282" font-size="30" font-weight="bold" text-anchor="middle">17 / 13</text><text x="32" y="365" font-size="15">The stated read symmetries alone do not force a = b.</text><text x="32" y="388" font-size="15">Native work normalization is a separate test.</text></g></svg>
