<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" width="850" height="370" role="img"><title>Eight-state node: axial and rotational channels</title><rect x="1" y="1" width="848" height="368" rx="16" fill="#f7f9fc" stroke="#cbd5e1"/><g font-family="Arial, sans-serif" fill="#1b2d42"><text x="425" y="40" text-anchor="middle" font-size="25" fill="#1b2d42" font-weight="bold">Eight-state node: body-diagonal projection</text><polygon points="270.0,85.0 365.3,140.0 365.3,250.0 270.0,305.0 174.7,250.0 174.7,140.0" fill="#e7eef7" stroke="#71859a" stroke-width="2"/><polygon points="270.0,85.0 365.3,250.0 174.7,250.0" fill="none" stroke="#356a9b" stroke-width="2.5"/><polygon points="365.3,140.0 270.0,305.0 174.7,140.0" fill="none" stroke="#b77539" stroke-width="2.5"/><circle cx="270.0" cy="85.0" r="8" fill="#356a9b"/><circle cx="365.3" cy="140.0" r="8" fill="#b77539"/><circle cx="365.3" cy="250.0" r="8" fill="#356a9b"/><circle cx="270.0" cy="305.0" r="8" fill="#b77539"/><circle cx="174.7" cy="250.0" r="8" fill="#356a9b"/><circle cx="174.7" cy="140.0" r="8" fill="#b77539"/><circle cx="270" cy="195" r="17" fill="#d0e9e3" stroke="#067d6c" stroke-width="2"/><circle cx="270" cy="195" r="5" fill="#067d6c"/><path d="M289 195 H415" stroke="#067d6c" stroke-width="1.5"/><text x="430" y="185" text-anchor="start" font-size="18" fill="#067d6c" font-weight="bold">Two projected axial vertices</text><text x="430" y="209" text-anchor="start" font-size="17" fill="#1b2d42" font-weight="normal">Six surrounding vertices</text><text x="430" y="255" text-anchor="start" font-size="27" fill="#1b2d42" font-weight="bold">8 = 2 + 3 × 2</text><text x="430" y="279" text-anchor="start" font-size="16" fill="#526779" font-weight="normal">Three paired rotational channels</text><text x="425" y="348" text-anchor="middle" font-size="14" fill="#526779" font-weight="normal">Geometric projection; the algebraic channel identification is a proposed representation.</text></g></svg>