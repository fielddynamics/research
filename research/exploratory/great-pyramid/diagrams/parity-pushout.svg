<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img"><title>Abstract parity-pushout register growth</title><rect x="1" y="1" width="898" height="388" rx="16" fill="#f6f8fa" stroke="#cbd5e1"/><g font-family="Arial, sans-serif" fill="#142d43"><text x="450" y="42" text-anchor="middle" font-size="26" fill="#142d43" font-weight="bold">Abstract parity-pushout register growth</text><circle cx="340" cy="195" r="135" fill="#5c9bd0" fill-opacity=".25" stroke="#356a9b" stroke-width="2"/><circle cx="560" cy="195" r="135" fill="#e2a05d" fill-opacity=".3" stroke="#b77539" stroke-width="2"/><text x="288" y="115" text-anchor="middle" font-size="21" fill="#356a9b" font-weight="bold">Sheet A</text><text x="612" y="115" text-anchor="middle" font-size="21" fill="#b77539" font-weight="bold">Sheet B</text><text x="290" y="205" text-anchor="middle" font-size="43" fill="#142d43" font-weight="bold">4</text><text x="610" y="205" text-anchor="middle" font-size="43" fill="#142d43" font-weight="bold">4</text><text x="450" y="205" text-anchor="middle" font-size="38" fill="#142d43" font-weight="bold">13</text><text x="290" y="232" text-anchor="middle" font-size="16" fill="#142d43" font-weight="normal">exclusive</text><text x="610" y="232" text-anchor="middle" font-size="16" fill="#142d43" font-weight="normal">exclusive</text><text x="450" y="233" text-anchor="middle" font-size="14" fill="#142d43" font-weight="normal">shared</text><text x="450" y="350" text-anchor="middle" font-size="25" fill="#142d43" font-weight="bold">17 + 17 − 13 = 21</text><text x="450" y="375" text-anchor="middle" font-size="14" fill="#52677a" font-weight="normal">Abstract sets only — not the physical TetA / TetB signatures.</text></g></svg>