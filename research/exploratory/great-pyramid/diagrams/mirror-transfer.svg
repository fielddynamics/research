<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><title>Two local terminals and proposed TetB channel</title><defs><linearGradient id="stone" x2="0.75" y2="1"><stop stop-color="#f3d6a0"/><stop offset="1" stop-color="#b7894f"/></linearGradient><linearGradient id="shade" x2="1" y2="1"><stop stop-color="#b89c76"/><stop offset="1" stop-color="#6d593d"/></linearGradient><linearGradient id="dark" x2="1" y2="1"><stop stop-color="#0a192b"/><stop offset="1" stop-color="#1a3e50"/></linearGradient></defs><rect x="1" y="1" width="998" height="518" rx="18" fill="#f6f8fa" stroke="#c8d5df"/><g font-family="Arial, Helvetica, sans-serif" fill="#142d43"><text x="34" y="45" font-size="28" fill="#142d43" font-weight="700" text-anchor="start">A complementary address, not a second local TetB</text><text x="34" y="71" font-size="15" fill="#52677a" font-weight="400" text-anchor="start">Hypothetical two-site interaction  /  each terminal has its own local dual-tetrad structure</text><rect x="35" y="108" width="270" height="352" rx="14" fill="white" stroke="#c6d5de"/><text x="170" y="141" font-size="16" fill="#3277a9" font-weight="700" text-anchor="middle">SITE x · SOURCE</text><path d="M170 165 L77 280 L263 280 Z" fill="url(#stone)" stroke="#a87b43"/><path d="M170 165 L263 280 L288 260 Z" fill="url(#shade)"/><rect x="153" y="239" width="35" height="14" fill="#0d2033" stroke="#1bcdb8" stroke-width="2"/><text x="71" y="320" font-size="15" fill="#52677a" font-weight="400" text-anchor="start">TetA</text><text x="260" y="320" font-size="23" fill="#3277a9" font-weight="700" text-anchor="end">21</text><text x="71" y="366" font-size="15" fill="#52677a" font-weight="400" text-anchor="start">Field Origin</text><text x="260" y="366" font-size="23" fill="#078a83" font-weight="700" text-anchor="end">17</text><text x="71" y="412" font-size="15" fill="#52677a" font-weight="400" text-anchor="start">TetB</text><text x="260" y="412" font-size="23" fill="#3277a9" font-weight="700" text-anchor="end">13</text><rect x="695" y="108" width="270" height="352" rx="14" fill="white" stroke="#c6d5de"/><text x="830" y="141" font-size="16" fill="#b57c36" font-weight="700" text-anchor="middle">SITE y · RECEIVER</text><path d="M830 165 L737 280 L923 280 Z" fill="url(#stone)" stroke="#a87b43"/><path d="M830 165 L923 280 L948 260 Z" fill="url(#shade)"/><rect x="813" y="239" width="35" height="14" fill="#0d2033" stroke="#1bcdb8" stroke-width="2"/><text x="731" y="320" font-size="15" fill="#52677a" font-weight="400" text-anchor="start">TetA</text><text x="920" y="320" font-size="23" fill="#b57c36" font-weight="700" text-anchor="end">21</text><text x="731" y="366" font-size="15" fill="#52677a" font-weight="400" text-anchor="start">Field Origin</text><text x="920" y="366" font-size="23" fill="#078a83" font-weight="700" text-anchor="end">17</text><text x="731" y="412" font-size="15" fill="#52677a" font-weight="400" text-anchor="start">TetB</text><text x="920" y="412" font-size="23" fill="#b57c36" font-weight="700" text-anchor="end">13</text><rect x="330" y="149" width="340" height="267" rx="15" fill="url(#dark)"/><text x="500" y="183" font-size="13" fill="#a5ced8" font-weight="700" text-anchor="middle">PROPOSED TETB ADDRESS CHANNEL</text><text x="500" y="222" font-size="39" fill="#f0ca83" font-weight="700" text-anchor="middle">21 ↔ 21</text><text x="500" y="251" font-size="15" fill="#b8dce2" font-weight="400" text-anchor="middle">matched hinge labels</text><text x="500" y="294" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">Mirror geometry</text><text x="500" y="329" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">Opposite chirality</text><text x="500" y="364" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">Phase and frequency lock</text><path d="M305 247 L330 247" fill="none" stroke="#078a83" stroke-width="3"/><path d="M670 247 L695 247" fill="none" stroke="#078a83" stroke-width="3"/><text x="500" y="492" font-size="16" fill="#52677a" font-weight="400" text-anchor="middle">A physical interaction and a causal dynamics remain to be derived.</text></g></svg>