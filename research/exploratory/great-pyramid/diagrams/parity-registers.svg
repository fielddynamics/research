<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>Signed dual-tetrad coupling operators</title><defs><linearGradient id="gpbg" x2="1" y2="1"><stop stop-color="#102237"/><stop offset="1" stop-color="#162f43"/></linearGradient><linearGradient id="stone" x2="0.75" y2="1"><stop stop-color="#f3d6a0"/><stop offset="1" stop-color="#b7894f"/></linearGradient><linearGradient id="shade" x2="1" y2="1"><stop stop-color="#b89c76"/><stop offset="1" stop-color="#6d593d"/></linearGradient><linearGradient id="dark" x2="1" y2="1"><stop stop-color="#0a192b"/><stop offset="1" stop-color="#1a3e50"/></linearGradient></defs><rect x="1" y="1" width="998" height="488" rx="18" fill="url(#gpbg)" stroke="#496075"/><g font-family="Arial, Helvetica, sans-serif" fill="#eef5fb"><text x="34" y="45" font-size="28" fill="#eef5fb" font-weight="700" text-anchor="start">The Field Origin is the invariant midpoint</text><text x="34" y="71" font-size="15" fill="#b7c9d7" font-weight="400" text-anchor="start">One graded representation, three signatures  /  Tr(Aₛ) = 17 + 4s</text><rect x="35" y="118" width="930" height="93" rx="11" fill="#1b3a52" stroke="#496075"/><text x="55" y="152" font-size="21" fill="#78bdf0" font-weight="700" text-anchor="start">TetA</text><text x="55" y="180" font-size="15" fill="#b7c9d7" font-weight="400" text-anchor="start">Full identity</text><text x="330" y="146" font-size="12" fill="#b7c9d7" font-weight="700" text-anchor="start">INVARIANT</text><rect x="330" y="157" width="374" height="31" rx="4" fill="#1b3a52"/><rect x="716" y="157" width="84" height="31" rx="4" fill="#78bdf0" fill-opacity=".17" stroke="#78bdf0"/><text x="517" y="179" font-size="18" fill="#eef5fb" font-weight="700" text-anchor="middle">1 + 16 = 17</text><text x="758" y="179" font-size="18" fill="#78bdf0" font-weight="700" text-anchor="middle">+4</text><text x="905" y="181" font-size="40" fill="#78bdf0" font-weight="700" text-anchor="middle">21</text><rect x="35" y="230" width="930" height="93" rx="11" fill="#1b3a52" stroke="#496075"/><text x="55" y="264" font-size="21" fill="#59d4b5" font-weight="700" text-anchor="start">Field Origin</text><text x="55" y="292" font-size="15" fill="#b7c9d7" font-weight="400" text-anchor="start">Even projection</text><text x="330" y="258" font-size="12" fill="#b7c9d7" font-weight="700" text-anchor="start">INVARIANT</text><rect x="330" y="269" width="374" height="31" rx="4" fill="#1b3a52"/><rect x="716" y="269" width="84" height="31" rx="4" fill="#59d4b5" fill-opacity=".17" stroke="#59d4b5"/><text x="517" y="291" font-size="18" fill="#eef5fb" font-weight="700" text-anchor="middle">1 + 16 = 17</text><text x="758" y="291" font-size="18" fill="#59d4b5" font-weight="700" text-anchor="middle">0</text><text x="905" y="293" font-size="40" fill="#59d4b5" font-weight="700" text-anchor="middle">17</text><rect x="35" y="342" width="930" height="93" rx="11" fill="#1b3a52" stroke="#496075"/><text x="55" y="376" font-size="21" fill="#d6a15e" font-weight="700" text-anchor="start">TetB</text><text x="55" y="404" font-size="15" fill="#b7c9d7" font-weight="400" text-anchor="start">Signed reflection</text><text x="330" y="370" font-size="12" fill="#b7c9d7" font-weight="700" text-anchor="start">INVARIANT</text><rect x="330" y="381" width="374" height="31" rx="4" fill="#1b3a52"/><rect x="716" y="381" width="84" height="31" rx="4" fill="#d6a15e" fill-opacity=".17" stroke="#d6a15e"/><text x="517" y="403" font-size="18" fill="#eef5fb" font-weight="700" text-anchor="middle">1 + 16 = 17</text><text x="758" y="403" font-size="18" fill="#d6a15e" font-weight="700" text-anchor="middle">−4</text><text x="905" y="405" font-size="40" fill="#d6a15e" font-weight="700" text-anchor="middle">13</text><text x="34" y="466" font-size="16" fill="#b7c9d7" font-weight="400" text-anchor="start">The four-dimensional sector changes sign. The 17-dimensional invariant sector does not.</text></g></svg>