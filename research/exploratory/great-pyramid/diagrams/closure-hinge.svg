<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc"><title id="title">The signed coupling ladder and interlevel hinge</title><desc id="desc">At K=4 the TetB trace 13, Field Origin trace 17 and TetA trace 21 are separated by four. The K=5 negative, neutral and positive signatures 21, 26 and 31 are separated by five. The two 21 labels coincide; the local Field Origin remains 17.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102237"/><stop offset="1" stop-color="#162f43"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#91a9bc"/></marker></defs>
<rect x="1" y="1" width="998" height="473" rx="18" fill="url(#bg)" stroke="#496075"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#eef5fb"><text x="36" y="46" font-size="28" font-weight="700">The 21-band interlevel hinge</text><text x="36" y="75" font-size="16" fill="#b7c9d7">Signed coupling characters · f(K,s) = K² + 1 + sK</text>
<text x="42" y="130" font-size="19" font-weight="700">K = 4</text><text x="42" y="150" font-size="12" fill="#b7c9d7">Local dual tetrad</text>
<text x="42" y="299" font-size="19" font-weight="700">K = 5</text><text x="42" y="319" font-size="12" fill="#b7c9d7">Extended shell</text>
<rect x="225" y="105" width="218" height="93" rx="11" fill="#d6a15e" fill-opacity=".10" stroke="#d6a15e" stroke-width="1.6"/><text x="334" y="130" text-anchor="middle" font-size="14" fill="#d6a15e">TetB · s = −1</text><text x="334" y="175" text-anchor="middle" font-size="42" font-weight="700" fill="#d6a15e">13</text><rect x="478" y="105" width="218" height="93" rx="11" fill="#59d4b5" fill-opacity=".10" stroke="#59d4b5" stroke-width="1.6"/><text x="587" y="130" text-anchor="middle" font-size="14" fill="#59d4b5">Field Origin · s = 0</text><text x="587" y="175" text-anchor="middle" font-size="42" font-weight="700" fill="#59d4b5">17</text><rect x="731" y="105" width="218" height="93" rx="11" fill="#78bdf0" fill-opacity=".10" stroke="#78bdf0" stroke-width="1.6"/><text x="840" y="130" text-anchor="middle" font-size="14" fill="#78bdf0">TetA · s = +1</text><text x="840" y="175" text-anchor="middle" font-size="42" font-weight="700" fill="#78bdf0">21</text><path d="M445 154h29" fill="none" stroke="#91a9bc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="459" y="139" text-anchor="middle" font-size="12" fill="#b7c9d7">+4</text><path d="M698 154h29" fill="none" stroke="#91a9bc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="712" y="139" text-anchor="middle" font-size="12" fill="#b7c9d7">+4</text><rect x="225" y="274" width="218" height="93" rx="11" fill="#d6a15e" fill-opacity=".10" stroke="#d6a15e" stroke-width="1.6"/><text x="334" y="299" text-anchor="middle" font-size="14" fill="#d6a15e">Negative · s = −1</text><text x="334" y="344" text-anchor="middle" font-size="42" font-weight="700" fill="#d6a15e">21</text><rect x="478" y="274" width="218" height="93" rx="11" fill="#59d4b5" fill-opacity=".10" stroke="#59d4b5" stroke-width="1.6"/><text x="587" y="299" text-anchor="middle" font-size="14" fill="#59d4b5">Neutral · s = 0</text><text x="587" y="344" text-anchor="middle" font-size="42" font-weight="700" fill="#59d4b5">26</text><rect x="731" y="274" width="218" height="93" rx="11" fill="#78bdf0" fill-opacity=".10" stroke="#78bdf0" stroke-width="1.6"/><text x="840" y="299" text-anchor="middle" font-size="14" fill="#78bdf0">Positive · s = +1</text><text x="840" y="344" text-anchor="middle" font-size="42" font-weight="700" fill="#78bdf0">31</text><path d="M445 323h29" fill="none" stroke="#91a9bc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="459" y="308" text-anchor="middle" font-size="12" fill="#b7c9d7">+5</text><path d="M698 323h29" fill="none" stroke="#91a9bc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="712" y="308" text-anchor="middle" font-size="12" fill="#b7c9d7">+5</text><path d="M840 198V235H334V273" fill="none" stroke="#f0cf7d" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="480" y="214" width="213" height="40" rx="7" fill="#152d40" stroke="#f0cf7d"/><text x="586" y="239" text-anchor="middle" font-size="16" font-weight="700" fill="#f0cf7d">21 = 21 · exact match</text>
<text x="36" y="411" font-size="18" font-weight="700" fill="#59d4b5">Local Field Origin = 17. Interlevel matching label = 21.</text><text x="36" y="440" font-size="14" fill="#b7c9d7">Dimensionless character equality; a physical transition and its frequency still require a dynamical law.</text></g></svg>