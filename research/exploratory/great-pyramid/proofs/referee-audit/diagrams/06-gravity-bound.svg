<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img"><title>A sharper self-gravity bound</title><desc>Displacement from the geometric plane; stated monopole and density model.</desc><rect x="1" y="1" width="958" height="308" rx="16" fill="#f7f9fc" stroke="#d6e0e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="40" font-size="25" fill="#172b42" font-weight="700" text-anchor="start">A sharper self-gravity bound</text><text x="30" y="64" font-size="13" fill="#52667e" font-weight="400" text-anchor="start">Displacement from the geometric plane; stated monopole and density model.</text><text x="30" y="126" font-size="15" fill="#172b42" font-weight="700" text-anchor="start">Original conservative estimate</text><rect x="345" y="108" width="500" height="25" rx="4" fill="#eaf1f7" stroke="#eaf1f7" stroke-width="1.3"/><rect x="345" y="108" width="500.0" height="25" rx="4" fill="#52667e" stroke="#52667e" stroke-width="1.3"/><text x="855" y="126" font-size="16" fill="#52667e" font-weight="700" text-anchor="start">0.36 in</text><text x="30" y="184" font-size="15" fill="#172b42" font-weight="700" text-anchor="start">Volume-based referee bound</text><rect x="345" y="166" width="500" height="25" rx="4" fill="#eaf1f7" stroke="#eaf1f7" stroke-width="1.3"/><rect x="345" y="166" width="226.38888888888889" height="25" rx="4" fill="#087f7c" stroke="#087f7c" stroke-width="1.3"/><text x="855" y="184" font-size="16" fill="#087f7c" font-weight="700" text-anchor="start">0.163 in</text><text x="30" y="242" font-size="15" fill="#172b42" font-weight="700" text-anchor="start">Phase 0 nominal model shift</text><rect x="345" y="224" width="500" height="25" rx="4" fill="#eaf1f7" stroke="#eaf1f7" stroke-width="1.3"/><rect x="345" y="224" width="27.77777777777778" height="25" rx="4" fill="#2465a2" stroke="#2465a2" stroke-width="1.3"/><text x="855" y="242" font-size="16" fill="#2465a2" font-weight="700" text-anchor="start">0.02 in</text><text x="30" y="288" font-size="14" fill="#52667e" font-weight="400" text-anchor="start">The bound is conditional; the 0.80–0.82 in survey residual is a different quantity.</text></g></svg>