<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img"><title>Five proofs, one research programme</title><desc>Exact mathematical results are separated from the physical bridges that remain to be derived.</desc><rect x="1" y="1" width="958" height="408" rx="16" fill="#f7f9fc" stroke="#d6e0e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="40" font-size="25" fill="#172b42" font-weight="700" text-anchor="start">Five proofs, one research programme</text><text x="30" y="64" font-size="13" fill="#52667e" font-weight="400" text-anchor="start">Exact mathematical results are separated from the physical bridges that remain to be derived.</text><rect x="30" y="112" width="164" height="150" rx="8" fill="#ffffff" stroke="#2465a2" stroke-width="1.3"/><text x="44" y="140" font-size="13" fill="#2465a2" font-weight="700" text-anchor="start">GP-1</text><text x="44" y="169" font-size="19" fill="#172b42" font-weight="700" text-anchor="start">Geometry</text><text x="44" y="202" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">Half-section</text><text x="44" y="224" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">balance plane</text><line x1="195" y1="187" x2="213" y2="187" stroke="#52667e" stroke-width="1.6" stroke-dasharray=""/><polygon points="213.000,187.000 204.224,191.794 204.224,182.206" fill="#52667e" stroke="#52667e" stroke-width="1.5"/><rect x="214" y="112" width="164" height="150" rx="8" fill="#ffffff" stroke="#2465a2" stroke-width="1.3"/><text x="228" y="140" font-size="13" fill="#2465a2" font-weight="700" text-anchor="start">GP-2</text><text x="228" y="169" font-size="19" fill="#172b42" font-weight="700" text-anchor="start">Robustness</text><text x="228" y="202" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">Field-gradient</text><text x="228" y="224" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">sensitivity</text><line x1="379" y1="187" x2="397" y2="187" stroke="#52667e" stroke-width="1.6" stroke-dasharray=""/><polygon points="397.000,187.000 388.224,191.794 388.224,182.206" fill="#52667e" stroke="#52667e" stroke-width="1.5"/><rect x="398" y="112" width="164" height="150" rx="8" fill="#ffffff" stroke="#087f7c" stroke-width="1.3"/><text x="412" y="140" font-size="13" fill="#087f7c" font-weight="700" text-anchor="start">GP-3</text><text x="412" y="169" font-size="19" fill="#172b42" font-weight="700" text-anchor="start">Grading</text><text x="412" y="202" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">17 + 4</text><text x="412" y="224" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">spectral hinge</text><line x1="563" y1="187" x2="581" y2="187" stroke="#52667e" stroke-width="1.6" stroke-dasharray=""/><polygon points="581.000,187.000 572.224,191.794 572.224,182.206" fill="#52667e" stroke="#52667e" stroke-width="1.5"/><rect x="582" y="112" width="164" height="150" rx="8" fill="#ffffff" stroke="#087f7c" stroke-width="1.3"/><text x="596" y="140" font-size="13" fill="#087f7c" font-weight="700" text-anchor="start">GP-4</text><text x="596" y="169" font-size="19" fill="#172b42" font-weight="700" text-anchor="start">Phase</text><text x="596" y="202" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">Registration</text><text x="596" y="224" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">and coherence</text><line x1="747" y1="187" x2="765" y2="187" stroke="#52667e" stroke-width="1.6" stroke-dasharray=""/><polygon points="765.000,187.000 756.224,191.794 756.224,182.206" fill="#52667e" stroke="#52667e" stroke-width="1.5"/><rect x="766" y="112" width="164" height="150" rx="8" fill="#ffffff" stroke="#b47126" stroke-width="1.3"/><text x="780" y="140" font-size="13" fill="#b47126" font-weight="700" text-anchor="start">GP-5</text><text x="780" y="169" font-size="19" fill="#172b42" font-weight="700" text-anchor="start">Transfer</text><text x="780" y="202" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">Coupling</text><text x="780" y="224" font-size="15" fill="#172b42" font-weight="400" text-anchor="start">budget</text><line x1="220" y1="272" x2="220" y2="297" stroke="#a34544" stroke-width="1.6" stroke-dasharray="4 3"/><text x="220" y="321" font-size="13" fill="#a34544" font-weight="700" text-anchor="middle">A · Physical registration</text><line x1="487" y1="272" x2="487" y2="297" stroke="#a34544" stroke-width="1.6" stroke-dasharray="4 3"/><text x="487" y="321" font-size="13" fill="#a34544" font-weight="700" text-anchor="middle">B · Phase dynamics</text><line x1="744" y1="272" x2="744" y2="297" stroke="#a34544" stroke-width="1.6" stroke-dasharray="4 3"/><text x="744" y="321" font-size="13" fill="#a34544" font-weight="700" text-anchor="middle">C · Native interaction</text><text x="480" y="378" font-size="15" fill="#52667e" font-weight="400" text-anchor="middle">Theorems constrain a Stargate model; the intersite interaction remains a hypothesis.</text></g></svg>