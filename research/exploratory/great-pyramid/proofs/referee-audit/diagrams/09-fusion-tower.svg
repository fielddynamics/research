<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img"><title>Fusion tower: every new factor is coprime</title><desc>Aₙ₊₁ = Aₙ Bₙ,  gcd(Aₙ, Bₙ) = 1  ·  K = 4 example</desc><rect x="1" y="1" width="958" height="308" rx="16" fill="#f7f9fc" stroke="#d6e0e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="40" font-size="25" fill="#172b42" font-weight="700" text-anchor="start">Fusion tower: every new factor is coprime</text><text x="30" y="64" font-size="13" fill="#52667e" font-weight="400" text-anchor="start">Aₙ₊₁ = Aₙ Bₙ,  gcd(Aₙ, Bₙ) = 1  ·  K = 4 example</text><rect x="30" y="118" width="207" height="96" rx="8" fill="#ffffff" stroke="#087f7c" stroke-width="1.3"/><text x="133.5" y="153" font-size="14" fill="#52667e" font-weight="400" text-anchor="middle">initial factor</text><text x="133.5" y="183" font-size="22" fill="#087f7c" font-weight="700" text-anchor="middle">21</text><line x1="237" y1="166" x2="260" y2="166" stroke="#087f7c" stroke-width="2" stroke-dasharray=""/><polygon points="260.000,166.000 251.224,170.794 251.224,161.206" fill="#087f7c" stroke="#087f7c" stroke-width="1.5"/><rect x="261" y="118" width="207" height="96" rx="8" fill="#ffffff" stroke="#087f7c" stroke-width="1.3"/><text x="364.5" y="153" font-size="14" fill="#52667e" font-weight="400" text-anchor="middle">× 13</text><text x="364.5" y="183" font-size="22" fill="#087f7c" font-weight="700" text-anchor="middle">273</text><line x1="468" y1="166" x2="491" y2="166" stroke="#087f7c" stroke-width="2" stroke-dasharray=""/><polygon points="491.000,166.000 482.224,170.794 482.224,161.206" fill="#087f7c" stroke="#087f7c" stroke-width="1.5"/><rect x="492" y="118" width="207" height="96" rx="8" fill="#ffffff" stroke="#087f7c" stroke-width="1.3"/><text x="595.5" y="153" font-size="14" fill="#52667e" font-weight="400" text-anchor="middle">× 241</text><text x="595.5" y="183" font-size="22" fill="#087f7c" font-weight="700" text-anchor="middle">65,793</text><line x1="699" y1="166" x2="722" y2="166" stroke="#087f7c" stroke-width="2" stroke-dasharray=""/><polygon points="722.000,166.000 713.224,170.794 713.224,161.206" fill="#087f7c" stroke="#087f7c" stroke-width="1.5"/><rect x="723" y="118" width="207" height="96" rx="8" fill="#ffffff" stroke="#087f7c" stroke-width="1.3"/><text x="826.5" y="153" font-size="14" fill="#52667e" font-weight="400" text-anchor="middle">× 65,281</text><text x="826.5" y="183" font-size="22" fill="#087f7c" font-weight="700" text-anchor="middle">4,295,032,833</text><text x="480" y="261" font-size="16" fill="#172b42" font-weight="400" text-anchor="middle">Each earlier factor divides Aₙ; therefore every earlier factor is coprime to Bₙ.</text></g></svg>