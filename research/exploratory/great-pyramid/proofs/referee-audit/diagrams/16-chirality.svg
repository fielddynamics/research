<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img"><title>Chirality must transform with the labels</title><desc>A Gram matrix can remain identical when an odd column permutation reverses orientation.</desc><rect x="1" y="1" width="958" height="328" rx="16" fill="#f7f9fc" stroke="#d6e0e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="40" font-size="25" fill="#172b42" font-weight="700" text-anchor="start">Chirality must transform with the labels</text><text x="30" y="64" font-size="13" fill="#52667e" font-weight="400" text-anchor="start">A Gram matrix can remain identical when an odd column permutation reverses orientation.</text><rect x="70" y="90" width="320" height="214" rx="8" fill="#ffffff" stroke="#d6e0e9" stroke-width="1.3"/><line x1="230" y1="196" x2="322" y2="196" stroke="#2465a2" stroke-width="3" stroke-dasharray=""/><polygon points="322.000,196.000 313.224,200.794 313.224,191.206" fill="#2465a2" stroke="#2465a2" stroke-width="1.5"/><line x1="230" y1="196" x2="175" y2="242" stroke="#b47126" stroke-width="3" stroke-dasharray=""/><polygon points="175.000,242.000 178.656,232.692 184.808,240.047" fill="#b47126" stroke="#b47126" stroke-width="1.5"/><line x1="230" y1="196" x2="230" y2="117" stroke="#087f7c" stroke-width="3" stroke-dasharray=""/><polygon points="230.000,117.000 234.794,125.776 225.206,125.776" fill="#087f7c" stroke="#087f7c" stroke-width="1.5"/><text x="333" y="201" font-size="18" fill="#2465a2" font-weight="700" text-anchor="start">1</text><text x="158" y="252" font-size="18" fill="#b47126" font-weight="700" text-anchor="start">2</text><text x="240" y="123" font-size="18" fill="#087f7c" font-weight="700" text-anchor="start">3</text><text x="230" y="268" font-size="17" fill="#087f7c" font-weight="700" text-anchor="middle">det = +1</text><text x="230" y="298" font-size="17" fill="#172b42" font-weight="700" text-anchor="middle">G = I₃</text><rect x="570" y="90" width="320" height="214" rx="8" fill="#ffffff" stroke="#d6e0e9" stroke-width="1.3"/><line x1="730" y1="196" x2="822" y2="196" stroke="#2465a2" stroke-width="3" stroke-dasharray=""/><polygon points="822.000,196.000 813.224,200.794 813.224,191.206" fill="#2465a2" stroke="#2465a2" stroke-width="1.5"/><line x1="730" y1="196" x2="675" y2="242" stroke="#b47126" stroke-width="3" stroke-dasharray=""/><polygon points="675.000,242.000 678.656,232.692 684.808,240.047" fill="#b47126" stroke="#b47126" stroke-width="1.5"/><line x1="730" y1="196" x2="730" y2="117" stroke="#087f7c" stroke-width="3" stroke-dasharray=""/><polygon points="730.000,117.000 734.794,125.776 725.206,125.776" fill="#087f7c" stroke="#087f7c" stroke-width="1.5"/><text x="833" y="201" font-size="18" fill="#2465a2" font-weight="700" text-anchor="start">2</text><text x="658" y="252" font-size="18" fill="#b47126" font-weight="700" text-anchor="start">1</text><text x="740" y="123" font-size="18" fill="#087f7c" font-weight="700" text-anchor="start">3</text><text x="730" y="268" font-size="17" fill="#a34544" font-weight="700" text-anchor="middle">det = −1</text><text x="730" y="298" font-size="17" fill="#172b42" font-weight="700" text-anchor="middle">G = I₃</text><line x1="405" y1="174" x2="555" y2="174" stroke="#a34544" stroke-width="2" stroke-dasharray=""/><polygon points="555.000,174.000 546.224,178.794 546.224,169.206" fill="#a34544" stroke="#a34544" stroke-width="1.5"/><text x="480" y="159" font-size="15" fill="#a34544" font-weight="700" text-anchor="middle">swap 1 ↔ 2</text><text x="480" y="315" font-size="14" fill="#52667e" font-weight="400" text-anchor="middle">A physically oriented reference or permutation-consistent matching is essential.</text></g></svg>