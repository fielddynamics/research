<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"><rect width="760" height="500" fill="#fff"/><g font-family="Arial,sans-serif" fill="#203247" text-anchor="middle"><text x="380" y="37" font-size="24" font-weight="bold">Time-face clock response</text><rect x="175" y="60" width="410" height="66" rx="9" fill="#e9f1f9" stroke="#477eaf"/><text x="380" y="87" font-size="19">Coupled time faces</text><text x="380" y="111" font-size="15">Native mass-dependent clock susceptibility (open)</text><path d="M380 126v31" stroke="#526c83" stroke-width="2"/><path d="M374 150l6 9 6-9" fill="#526c83"/><rect x="175" y="160" width="410" height="60" rx="9" fill="#e9f5ef" stroke="#599b80"/><text x="380" y="185" font-size="19">Physical lapse N = exp(u)</text><text x="380" y="206" font-size="15">Proper time dτ = N dt</text><path d="M380 220v23H195v28M380 243H565v28" fill="none" stroke="#526c83" stroke-width="2"/><rect x="40" y="274" width="310" height="72" rx="9" fill="#f1f5fb" stroke="#477eaf"/><text x="195" y="300" font-size="18">Four-port directional gradient</text><text x="195" y="327" font-size="18">g = −c² ∇u</text><rect x="410" y="274" width="310" height="72" rx="9" fill="#f9f2e4" stroke="#b68942"/><text x="565" y="300" font-size="18">Weak GR spatial response</text><text x="565" y="327" font-size="18">hᵢⱼ ≈ (1 − 2u) δᵢⱼ</text><path d="M195 346v25h185M565 346v25H380v25" fill="none" stroke="#526c83" stroke-width="2"/><rect x="175" y="399" width="410" height="72" rx="9" fill="#f7f8fa" stroke="#8794a2"/><text x="380" y="427" font-size="19">Weak gravitational normalization</text><text x="380" y="453" font-size="19">G = c⁴/(4πκ) = c⁴h/(πJ)</text><text x="380" y="488" font-size="12">J must be derived from the same native settlement action.</text></g></svg>
