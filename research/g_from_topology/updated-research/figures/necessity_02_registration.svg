<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" font-family="Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52647a"/></marker></defs><rect x="0" y="0" width="960" height="520" rx="0" fill="#f7fafc" stroke="#f7fafc"/><text x="32" y="30" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start">GFD  /  CLOSURE NECESSITY</text><text x="32" y="68" font-size="28" fill="#142b45" font-weight="700" text-anchor="start">Mutual inclusion and shared settlement</text><text x="32" y="98" font-size="15" fill="#52647a" font-weight="400" text-anchor="start">Schematic fixed-domain interface; not a spatial TetA–TetB tunnel</text><ellipse cx="480" cy="280" rx="427" ry="150" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><circle cx="360" cy="267" r="116" fill="#dbeafe" fill-opacity=".8" stroke="#2563eb" stroke-width="2"/><circle cx="600" cy="267" r="116" fill="#fef3c7" fill-opacity=".8" stroke="#b45309" stroke-width="2"/><text x="360" y="221" font-size="22" fill="#2563eb" font-weight="700" text-anchor="middle">Child A</text><text x="600" y="221" font-size="22" fill="#b45309" font-weight="700" text-anchor="middle">Child B</text><text x="360" y="250" font-size="22" fill="#142b45" font-weight="400" text-anchor="middle">W_A(g)</text><text x="600" y="250" font-size="22" fill="#142b45" font-weight="400" text-anchor="middle">W_B(g)</text><path d="M377 281 L455 281" stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M583 302 L505 302" stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="455" y="261" width="50" height="60" rx="12" fill="#fff" stroke="#0f766e"/><text x="480" y="296" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">g*</text><text x="480" y="367" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle">∂W_A/∂g + ∂W_B/∂g = 0</text><text x="