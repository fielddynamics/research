<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="Forward–bridge–inverse Walsh filter"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#536b82"/></marker></defs><rect width="1000" height="490" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="37" font-size="13" fill="#536b82" text-anchor="start" font-weight="700">GFD  /  PROJECTIVE NORM &amp; WALSH RESEARCH</text><text x="35" y="77" font-size="30" fill="#17304a" text-anchor="start" font-weight="700">Forward–bridge–inverse Walsh filter</text><text x="35" y="106" font-size="16" fill="#536b82" text-anchor="start" font-weight="400">Each spectral grade receives its gain once; the inverse tree is not the entire FWHT.</text><rect x="35" y="165" width="150" height="80" rx="7" fill="#f4f8fb" stroke="#1279b7"/><text x="110.0" y="196" font-size="20" fill="#1279b7" text-anchor="middle" font-weight="700">Truth table</text><text x="110.0" y="222" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">64 records</text><path d="M185 205 L225 205" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="230" y="165" width="150" height="80" rx="7" fill="#f4f8fb" stroke="#008d82"/><text x="305.0" y="196" font-size="20" fill="#008d82" text-anchor="middle" font-weight="700">Forward H</text><text x="305.0" y="222" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">W = H₆₄/8</text><path d="M380 205 L420 205" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="425" y="165" width="150" height="80" rx="7" fill="#f4f8fb" stroke="#8054b3"/><text x="500.0" y="196" font-size="20" fill="#8054b3" text-anchor="middle" font-weight="700">Spectral bridge</text><text x="500.0" y="222" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">1 | 3 | 12 | 48</text><path d="M575 205 L615 205" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="620" y="165" width="150" height="80" rx="7" fill="#f4f8fb" stroke="#1279b7"/><text x="695.0" y="196" font-size="20" fill="#1279b7" text-anchor="middle" font-weight="700">Inverse H</text><text x="695.0" y="222" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">W⁻¹ = W</text><path d="M770 205 L810 205" stroke="#536b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="815" y="165" width="150" height="80" rx="7" fill="#f4f8fb" stroke="#008d82"/><text x="890.0" y="196" font-size="20" fill="#008d82" text-anchor="middle" font-weight="700">Registered table</text><text x="890.0" y="222" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">64 records</text><text x="500" y="290" font-size="30" fill="#17304a" text-anchor="middle" font-weight="700">J = W Λ W⁻¹</text><rect x="150" y="320" width="9" height="48" rx="2" fill="#c28414" stroke="none"/><rect x="161" y="320" width="31" height="48" rx="2" fill="#1279b7" stroke="none"/><rect x="194" y="320" width="130" height="48" rx="2" fill="#008d82" stroke="none"/><text x="260.0" y="351" font-size="18" fill="white" text-anchor="middle" font-weight="700">12 · t₁</text><rect x="326" y="320" width="526" height="48" rx="2" fill="#8054b3" stroke="none"/><text x="590.0" y="351" font-size="18" fill="white" text-anchor="middle" font-weight="700">48 · t₂</text><text x="150" y="397" font-size="16" fill="#536b82" text-anchor="start" font-weight="400">DC = 1; grade 0 = 3</text><text x="850" y="397" font-size="16" fill="#536b82" text-anchor="end" font-weight="400">64 spectral coordinates</text><text x="500" y="443" font-size="20" fill="#17304a" text-anchor="middle" font-weight="700">Invariant contrasts: 1 + 4 + 16; common scalar preserved.</text><text x="35" y="473" font-size="13" fill="#536b82" text-anchor="start" font-weight="400">Exact algebra for the specified construction; physical source and gain selection remain open.</text></g></s