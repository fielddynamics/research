<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" font-family="Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52647a"/></marker></defs><rect x="0" y="0" width="960" height="520" rx="0" fill="#f7fafc" stroke="#f7fafc"/><text x="32" y="30" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start">GFD  /  CLOSURE NECESSITY</text><text x="32" y="68" font-size="28" fill="#142b45" font-weight="700" text-anchor="start">Force from the variation of closure</text><text x="32" y="98" font-size="15" fill="#52647a" font-weight="400" text-anchor="start">The envelope identity connects settlement to conservative mechanical response</text><rect x="32" y="130" width="270" height="294" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="345" y="130" width="270" height="294" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="658" y="130" width="270" height="294" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="167" y="177" font-size="20" fill="#2563eb" font-weight="700" text-anchor="middle">READ</text><text x="167" y="240" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">Neighbor data a, b</text><text x="167" y="288" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">Coupling c(r)</text><text x="167" y="336" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">Shared constraint</text><text x="480" y="177" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">SETTLE</text><text x="480" y="240" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">∂E/∂x = 0</text><text x="480" y="288" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">x* = (ka+cb)/(k+c)</text><text x="480" y="336" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">E* = kc(a−b)²/2(k+c)</text><text x="793" y="177" font-size="20" fill="#b45309" font-weight="700" text-anchor="middle">RESPOND</text><text x="793" y="240" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">Change separation r</text><text x="793" y="288" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">F = −dE*/dr</text><text x="793" y="336" font-size="16" fill="#142b45" font-weight="400" text-anchor="middle">Sign depends on c′(r)</text><path d="M302 277 L345 277" stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M615 277 L658 277" stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="480" y="470" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle">Counterexample: E = (x−r)²/2 settles at x=r, but E*=0 and F=0.</text></svg>