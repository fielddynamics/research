<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Finite-field tower and projective norm"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#536b82"/></marker></defs><rect width="1000" height="560" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="37" font-size="13" fill="#536b82" text-anchor="start" font-weight="700">GFD  /  PROJECTIVE NORM &amp; WALSH RESEARCH</text><text x="35" y="77" font-size="30" fill="#17304a" text-anchor="start" font-weight="700">Finite-field tower and projective norm</text><text x="35" y="106" font-size="16" fill="#536b82" text-anchor="start" font-weight="400">F₆₄ ∩ F₁₆ = F₄; the norm descends to projective multiplicative quotients.</text><path d="M500 200 L270 260" stroke="#536b82" stroke-width="2" fill="none"/><text x="353.0" y="230.0" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">degree 2</text><path d="M500 200 L730 260" stroke="#536b82" stroke-width="2" fill="none"/><text x="647.0" y="230.0" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">degree 3</text><path d="M270 340 L500 400" stroke="#536b82" stroke-width="2" fill="none"/><text x="417.0" y="370.0" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">degree 3</text><path d="M730 340 L500 400" stroke="#536b82" stroke-width="2" fill="none"/><text x="583.0" y="370.0" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">degree 2</text><rect x="380" y="125" width="240" height="75" rx="7" fill="#f4f8fb" stroke="#8054b3"/><text x="500.0" y="156" font-size="20" fill="#8054b3" text-anchor="middle" font-weight="700">F₄₀₉₆</text><text x="500.0" y="182" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">common extension</text><rect x="150" y="260" width="240" height="75" rx="7" fill="#f4f8fb" stroke="#1279b7"/><text x="270.0" y="291" font-size="20" fill="#1279b7" text-anchor="middle" font-weight="700">F₆₄</text><text x="270.0" y="317" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">3-dimensional over F₄</text><rect x="610" y="260" width="240" height="75" rx="7" fill="#f4f8fb" stroke="#008d82"/><text x="730.0" y="291" font-size="20" fill="#008d82" text-anchor="middle" font-weight="700">F₁₆</text><text x="730.0" y="317" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">2-dimensional over F₄</text><rect x="380" y="400" width="240" height="75" rx="7" fill="#f4f8fb" stroke="#c28414"/><text x="500.0" y="431" font-size="20" fill="#c28414" text-anchor="middle" font-weight="700">F₄</text><text x="500.0" y="457" font-size="15" fill="#536b82" text-anchor="middle" font-weight="400">base field</text><text x="60" y="515" font-size="19" fill="#17304a" text-anchor="start" font-weight="700">Norm: N(z) = z⁶⁵</text><text x="940" y="515" font-size="19" fill="#17304a" text-anchor="end" font-weight="700">Projective fibres: 273 → 21, size 13</text><text x="35" y="543" font-size="13" fill="#536b82" text-anchor="start" font-weight="400">Exact algebra for the specified construction; physical source and gain selection remain open.</text></g></svg>