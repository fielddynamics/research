<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed vortex response</title><style>body{font:17px system-ui;background:#f7fafc;color:#172c44;max-width:800px;margin:40px auto;padding:20px}input{width:100%}img{width:100%}output{font-weight:bold}section{background:white;padding:20px;border:1px solid #ccd6e0;border-radius:10px}</style><h1>Fixed geometry, responsive vortex</h1><img src="../figures/fixed_geometry_vortex.svg" alt="Fixed cube with a changing vortex state"><section><label for="h">Constitutive curvature h: <output id="hv"></output></label><input id="h" type="range" min="0" max="6.7" step="0.001" value="5.22"><p>Overlap susceptibility: <output id="u"></output></p><p>Central coordinate derivative: <output id="w"></output></p><p>Critical curvature: 6.7855</p><button id="reset">Use constitutive example t=1</button></section><p>Local stationary derivative, fixed norm and geometry. No derived physical radius, gravitational source or relaxation dynamics.</p><script>const k=42815/290521,h=document.getElementById('h');function render(){const a=Number(h.value),d=1-a*k;document.getElementById('hv').textContent=a.toFixed(4);document.getElementById('u').textContent=(2*k/d).toFixed(6);document.getElementById('w').textContent=(-2960/11319/d).toFixed(6)}h.oninput=render;document.getElementById('reset').onclick=()=>{h.value=308/59;render()};render()</script></html>
