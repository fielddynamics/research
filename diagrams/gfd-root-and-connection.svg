<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc"><title id="title">Two orientations, one metric image</title><desc id="desc">Parity-related tetrad orientations share a metric while torsion provides a possible orientation-sensitive sector</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="440" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Two orientations, one metric image</text><rect x="60" y="75" width="350" height="90" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="235.0" y="104" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">TetA: e</text><text x="235.0" y="128" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Future-pointing time leg</text><text x="235.0" y="148" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">One spatial orientation</text><rect x="550" y="75" width="350" height="90" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="725.0" y="104" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b45309">TetB: Pe</text><text x="725.0" y="128" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Same time leg</text><text x="725.0" y="148" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Opposite spatial orientation</text><path d="M420 117L540 117" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="101" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Parity P</text><path d="M235 165V185L480 226M725 165V185L480 226" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="270" y="228" width="420" height="78" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="480.0" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0f766e">Shared metric g</text><text x="480.0" y="281" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">eᵀηe = (Pe)ᵀη(Pe)</text><path d="M480 306L480 326" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="338" width="398" height="70" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="263.0" y="367" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">Torsion-free connection</text><text x="263.0" y="391" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Same Levi-Civita connection</text><rect x="498" y="338" width="398" height="70" rx="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 5"/><text x="697.0" y="367" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#7c3aed">Torsionful extension</text><text x="697.0" y="391" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Possible orientation-sensitive coupling</text><path d="M480 326H263V338M480 326H697V338" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
