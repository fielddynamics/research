<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="1000" height="640" role="img" aria-labelledby="title desc">
  <title id="title">GFD — Recursive field closure</title>
  <desc id="desc">Conceptual nested hierarchy of local closure, field objects, star systems, galaxies and clusters. Each object settles its internal field and presents a boundary record to its parent system. Not a literal spatial model.</desc>
  <rect width="500" height="320" rx="12" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="29" font-size="16" font-weight="bold" fill="#172033">Recursive field closure</text>
    <g transform="translate(12 35)">
      <circle cx="132" cy="132" r="121" fill="#64748b" fill-opacity=".045" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/>
      <circle cx="132" cy="132" r="92" fill="#8b5cf6" fill-opacity=".045" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="4 3"/>
      <circle cx="132" cy="132" r="63" fill="#0d9488" fill-opacity=".045" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="4 3"/>
      <circle cx="132" cy="132" r="34" fill="#d97706" fill-opacity=".045" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3"/>
      <circle cx="132" cy="132" r="8" fill="#d97706"/>
      <g fill="#0d9488"><circle cx="88" cy="163" r="4"/><circle cx="173" cy="151" r="4"/><circle cx="120" cy="82" r="4"/></g>
      <g fill="#8b5cf6"><circle cx="61" cy="109" r="5"/><circle cx="193" cy="178" r="5"/><circle cx="109" cy="215" r="5"/></g>
      <g stroke="#64748b" stroke-width="1" stroke-opacity=".85" fill="none">
        <path d="M140 132 H280"/><path d="M156 108 H280"/><path d="M177 88 L230 76 H280"/><path d="M195 65 L230 44 H280"/><path d="M215 44 L240 17 H280"/>
      </g>
      <g font-size="13" fill="#172033">
        <text x="288" y="21">Cluster</text><text x="288" y="48">Galaxy</text><text x="288" y="80">Star system</text><text x="288" y="112">Field object</text><text x="288" y="136">Local closure</text>
      </g>
    </g>
    <text x="24" y="301" font-size="10.5" fill="#475569">Conceptual hierarchy of distributed field processing · Not to scale</text>
  </g>
</svg>
