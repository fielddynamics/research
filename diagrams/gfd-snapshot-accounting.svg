<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 585" width="930" height="585" role="img" aria-labelledby="title desc"><title id="title">Snapshot accounting</title><desc id="desc">Field Object and NET Field are reconciled locally; the registered state remains coupled to the environment.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="930" height="585" rx="14" fill="white"/><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Snapshot accounting</text><rect x="45" y="65" width="330" height="75" rx="12" fill="#d97706" fill-opacity=".065" stroke="#d97706" stroke-width="1.8"/><text x="210.0" y="102.5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Field Object</text><text x="210.0" y="127.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Correlated configuration</text><rect x="525" y="65" width="330" height="75" rx="12" fill="#7c3aed" fill-opacity=".065" stroke="#7c3aed" stroke-width="1.8"/><text x="690.0" y="102.5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">NET Field</text><text x="690.0" y="127.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Locally present environment</text><path d="M210 140V158H450V182" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M690 140V158H450" fill="none" stroke="#64748b" stroke-width="2"/><rect x="280" y="182" width="340" height="55" rx="12" fill="#64748b" fill-opacity=".065" stroke="#64748b" stroke-width="1.8"/><text x="450.0" y="215.5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Closure boundary Σ</text><path d="M450 237V260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="225" y="260" width="450" height="75" rx="12" fill="#0d9488" fill-opacity=".065" stroke="#0d9488" stroke-width="1.8"/><text x="450.0" y="297.5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">READ — Full-State Snapshot</text><text x="450.0" y="322.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Complete coupled configuration</text><path d="M450 335V358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="225" y="358" width="450" height="75" rx="12" fill="#0d9488" fill-opacity=".065" stroke="#0d9488" stroke-width="1.8"/><text x="450.0" y="395.5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">SETTLE</text><text x="450.0" y="420.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Joint constraint compatibility</text><path d="M450 433V456" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="225" y="456" width="450" height="75" rx="12" fill="#7c3aed" fill-opacity=".065" stroke="#7c3aed" stroke-width="1.8"/><text x="450.0" y="493.5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">REGISTER — B*Σ</text><text x="450.0" y="518.5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Outcome: compatible registered state</text><path d="M675 494H802V210H620" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="807" y="365" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">continuous</text><text x="807" y="383" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">coupling</text><text x="450" y="564" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Logical dependencies, not a sequence of clock ticks.</text></svg>