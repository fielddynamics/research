<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385" role="img" aria-labelledby="title desc"><title id="title">Quiet, drive and brake are measured relative to GFD</title><desc id="desc">Three values of the inferred TetB strength and corresponding mass-decoding ratios</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="385" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Quiet, drive and brake are measured relative to GFD</text><rect x="38" y="80" width="264" height="235" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="170" y="114" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2563eb">BRAKE</text><text x="170" y="157" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#2563eb">w &lt; a₀</text><text x="170" y="187" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Weaker inferred strength</text><path d="M74 208L266 208" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="244" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2563eb">Mdec / Mphot &lt; 1</text><text x="170" y="278" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">CamB</text><rect x="348" y="80" width="264" height="235" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="480" y="114" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f766e">QUIET</text><text x="480" y="157" font-family="Arial,Helvetica,sans-serif" 