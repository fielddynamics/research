<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" width="960" height="365" role="img" aria-labelledby="title desc"><title id="title">Three distinct meanings, three distinct scales</title><desc id="desc">Field Origin, constitutive transition and closure boundary must not be conflated</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="365" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Three distinct meanings, three distinct scales</text><rect x="28" y="71" width="290" height="239" rx="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/><text x="173" y="104" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#7c3aed">Field Origin</text><path d="M173 125L118 209L228 209Z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M173 221L118 137L228 137Z" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="173" cy="173" r="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="173" y="252" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Internal coupling locus</text><text x="173" y="276" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">of the dual-tetrad geometry</text><rect x="342" y="71" width="290" height="239" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="487" y="104" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#b45309">Transition ring</text><circle cx="487" cy="173" r="49" fill="#fff7ed" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="487" cy="173" r="10" fill="#b45309" stroke="#b45309" stroke-width="1.6"/><text x="487" y="252" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">g = a₀ · μ = ½</text><text x="487" y="276" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Equal quiet drained shares</text><rect x="656" y="71" width="290" height="239" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="801" y="104" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f766e">Closure surface</text><ellipse cx="801" cy="173" rx="74" ry="46" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="801" cy="173" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.6"/><circle cx="727" cy="173" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><circle cx="875" cy="173" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="801" y="252" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Candidate registration interface</text><text x="801" y="276" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Set by object and host field</text><text x="480.0" y="346" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Conceptual panels at unrelated scales; the interfaces are not generally concentric.</text></svg>
