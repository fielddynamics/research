<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img"><title>Common closure space and exact frame transports</title><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><text x="540" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17263c">Proof 25 • One normed closure space</text><text x="540" y="61" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17263c">Five realizations, explicit isometries, no independent physical derivation implied</text><rect x="25" y="90" width="235" height="76" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="142.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Tetrad / Hadamard</text><text x="142.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">MᵀM = 4I − J</text><path d="M142.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="290" y="90" width="235" height="76" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="407.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Four-leg cut frame</text><text x="407.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">BBᵀ = 4I − J</text><path d="M407.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="555" y="90" width="235" height="76" rx="10" fill="white" stroke="#087f75" stroke-width="1.5"/><text x="672.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#087f75">Oriented cycle frame</text><text x="672.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">DᵀD = 4I − J</text><path d="M672.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="820" y="90" width="235" height="76" rx="10" fill="white" stroke="#087f75" stroke-width="1.5"/><text x="937.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#087f75">Flywheel column frame</text><text x="937.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">FᵀF = 4I − J</text><path d="M937.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="275" y="225" width="530" height="96" rx="10" fill="white" stroke="#7048ba" stroke-width="1.5"/><text x="540.0" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7048ba">Common closure space: sum q = 0</text><text x="540.0" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">P = I − J/4 • G = 4P</text><text x="540" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#17263c">Transport YXᵀ/4 • composition independent of path</text><path d="M540 321V361" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="275" y="363" width="530" height="80" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Two parity-related simplices</text><text x="540.0" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">qᵢ ≥ −1 and qᵢ ≤ 1, with Σqᵢ = 0</text><path d="M540 443V465H280V487" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><path d="M540 443V465H800V487" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="25" y="490" width="510" height="84" rx="10" fill="white" stroke="#087f75" stroke-width="1.5"/><text x="280.0" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#087f75">Shared octahedral core</text><text x="280.0" y="541" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">6 pair vertices • 12 edges • 8 faces</text><rect x="545" y="490" width="510" height="84" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="800.0" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Eight stellations</text><text x="800.0" y="541" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">4 apex regions in each chamber</text><text x="540" y="609" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17263c">Proof 23: recursive subdivision is downstream of this geometry.</text><text x="540" y="635" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">Physical metric selection, geometry-forming dynamics and gravitational coupling remain open.</text></svg>