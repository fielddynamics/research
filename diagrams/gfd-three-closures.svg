<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-labelledby="title desc"><title id="title">Three aspects of field closure</title><desc id="desc">Geometric, operational and compositional closure are distinct; the physical bridges remain research objectives.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="510" rx="14" fill="white"/><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Three aspects of field closure</text><rect x="215" y="63" width="650" height="100" rx="12" fill="#d97706" fill-opacity=".065" stroke="#d97706" stroke-width="1.8"/><text x="540.0" y="113.0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Geometric closure</text><text x="540.0" y="138.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Dual tetrad · bounded orientation sectors</text><rect x="215" y="204" width="650" height="100" rx="12" fill="#0d9488" fill-opacity=".065" stroke="#0d9488" stroke-width="1.8"/><text x="540.0" y="254.0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Operational closure</text><text x="540.0" y="279.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Full-State Snapshot · READ → SETTLE → REGISTER</text><rect x="215" y="345" width="650" height="100" rx="12" fill="#7c3aed" fill-opacity=".065" stroke="#7c3aed" stroke-width="1.8"/><text x="540.0" y="395.0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Compositional closure</text><text x="540.0" y="420.0" font-family="Arial,Helvetica,sans-serif" font-size="16"