<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" role="img" aria-labelledby="title desc"><title id="title">Overlapping fields, distinct ownership</title><desc id="desc">Two overlapping envelopes read the common environment while each registers only its owned source.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="550" rx="14" fill="white"/><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Overlapping fields, distinct ownership</text><circle cx="340" cy="240" r="148" fill="#0d9488" fill-opacity=".065" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 5"/><circle cx="560" cy="240" r="148" fill="#7c3aed" fill-opacity=".065" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/><circle cx="340" cy="240" r="13" fill="#0d9488" fill-opacity=".065" stroke="#0d9488" stroke-width="2"/><circle cx="560" cy="240" r="13" fill="#7c3aed" fill-opacity=".065" stroke="#7c3aed" stroke-width="2"/><text x="310" y="205" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#0d9488">Object A</text><text x="590" y="205" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#7c3aed">Object B</text><text x="450" y="279" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#475569">Shared</text><text x="450" y="299" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#475569">field</text><path d="M355 240H545" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M545 250H355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><rect x="95" y="415" width="330" height="72" rx="12" fill="#0d9488" fill-opacity=".065" stroke="#0d9488" stroke-width="1.8"/><text x="260.0" y="457.0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Owned source A → record A</text><rect x="475" y="415" width="330" height="72" rx="12" fill="#7c3aed" fill-opacity=".065" stroke="#7c3aed" stroke-width="1.8"/><text x="640.0" y="457.0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Owned source B → record B</text><path d="M340 388L260 415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M560 388L640 415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="528" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Overlap permits mutual field reads. Ownership keeps the sources distinct.</text></svg>