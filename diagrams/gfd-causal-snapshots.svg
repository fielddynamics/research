<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc"><title id="title">Local snapshots remain causally coupled</title><desc id="desc">Two local worldlines with retarded signals and no global synchronization</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="450" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">Local snapshots remain causally coupled</text><text x="180" y="77" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2563eb">Field Object A</text><text x="780" y="77" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f766e">Field Object B</text><path d="M180 100L180 392" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M780 100L780 392" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="126" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.6"/><circle cx="780" cy="126" r="8" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><circle cx="180" cy="210" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.6"/><circle cx="780" cy="210" r="8" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><circle cx="180" cy="294" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.6"/><circle cx="780" cy="294" r="8" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><circle cx="180" cy="378" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.6"/><circle cx="780" cy="378" r="8" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><path d="M188 126L772 294" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M772 210L188 378" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="172" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#475569">A change arrives later at B</text><text x="480" y="335" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#475569">B change arrives later at A</text><text x="76" y="237" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#475569">time ↓</text><text x="480" y="407" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#172033">Space separation L · light-crossing lower bound L/c</text><text x="480.0" y="431" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Snapshot = compatible local state; arrows are causal dependencies, not literal message packets.</text></svg>
