<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="title desc"><title id="title">From tetrad geometry to gravitational tests</title><desc id="desc">Two derivation branches and the unresolved dynamical bridge</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="530" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">From tetrad geometry to gravitational tests</text><rect x="35" y="70" width="410" height="73" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="99" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">Geometry</text><text x="240.0" y="123" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Orientation sectors · tetrahedral projection</text><rect x="515" y="70" width="410" height="73" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="720.0" y="99" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b45309">Constitutive premises</text><text x="720.0" y="123" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Screening · exchange · degree one</text><path d="M240 143L240 169" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720 143L720 169" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="35" y="170" width="410" height="78" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">Connection algebra</text><text x="240.0" y="223" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">40 + 24 · orientation-sensitive torsion</text><rect x="515" y="170" width="410" height="78" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="720.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b45309">Quiet law</text><text x="720.0" y="223" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">μ(x) = x/(1+x) · F′ = μ</text><path d="M240 248V274H480M720 248V274H480V300" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="258" y="301" width="444" height="78" rx="9" fill="#fff1f2" stroke="#be123c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="480.0" y="330" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#be123c">Physical bridge still to derive</text><text x="480.0" y="354" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Torsionful dynamics → effective response</text><path d="M480 379L480 402" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="35" y="403" width="410" height="82" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="240.0" y="432" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0f766e">Ownership / net-field rule</text><text x="240.0" y="456" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Drainless interior · drained host</text><rect x="515" y="403" width="410" height="82" rx="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/><text x="720.0" y="432" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#7c3aed">Observable tests</text><text x="720.0" y="456" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Cassini · wide binaries · galactic RAR</text><path d="M480 402H240V403M445 444H515" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480.0" y="511" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Exact identities constrain the programme; the full physical derivation is not supplied by the diagram.</text></svg>
