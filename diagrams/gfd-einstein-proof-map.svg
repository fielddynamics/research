<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1127" width="960" height="1127" role="img" aria-labelledby="title desc"><title id="title">From tetrad geometry to gravitational tests</title><desc id="desc">Two derivation branches and the unresolved dynamical bridge</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="530" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">From tetrad geometry to gravitational tests</text><rect x="35" y="70" width="410" height="73" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="99" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">Geometry</text><text x="240.0" y="123" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Orientation sectors · tetrahedral projection</text><rect x="515" y="70" width="410" height="73" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="720.0" y="99" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b45309">Constitutive premises</text><text x="720.0" y="123" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Screening · exchange · degree one</text><path d="M240 143L240 169" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720 143L720 169" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="35" y="170" width="410" height="78" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">Connection algebra</text><text x="240.0" y="223" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">40 + 24 · orientation-sensitive torsion</text><rect x="515" y="170" width="410" height="78" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="720.0" y="199" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b45309">Quiet law</text><text x="720.0" y="223" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">μ(x) = x/(1+x) · F′ = μ</text><path d="M240 248V274H480M720 248V274H480V300" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="258" y="301" width="444" height="78" rx="9" fill="#fff1f2" stroke="#be123c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="480.0" y="330" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#be123c">Physical bridge still to derive</text><text x="480.0" y="354" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Torsionful dynamics → effective response</text><path d="M480 379L480 402" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="35" y="403" width="410" height="82" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="240.0" y="432" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0f766e">Ownership / net-field rule</text><text x="240.0" y="456" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Drainless interior · drained host</text><rect x="515" y="403" width="410" height="82" rx="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/><text x="720.0" y="432" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#7c3aed">Observable tests</text><text x="720.0" y="456" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Cassini · wide binaries · galactic RAR</text><path d="M480 402H240V403M445 444H515" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480.0" y="511" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Exact identities constrain the programme; the full physical derivation is not supplied by the diagram.</text><svg x="0" y="535" width="960" height="587" viewBox="0 0 1080 660"><title>Common closure space and exact frame transports</title><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><text x="540" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17263c">Proof 25 • One normed closure space</text><text x="540" y="61" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17263c">Five realizations, explicit isometries, no independent physical derivation implied</text><rect x="25" y="90" width="235" height="76" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="142.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Tetrad / Hadamard</text><text x="142.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">MᵀM = 4I − J</text><path d="M142.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="290" y="90" width="235" height="76" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="407.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Four-leg cut frame</text><text x="407.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">BBᵀ = 4I − J</text><path d="M407.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="555" y="90" width="235" height="76" rx="10" fill="white" stroke="#087f75" stroke-width="1.5"/><text x="672.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#087f75">Oriented cycle frame</text><text x="672.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">DᵀD = 4I − J</text><path d="M672.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="820" y="90" width="235" height="76" rx="10" fill="white" stroke="#087f75" stroke-width="1.5"/><text x="937.5" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#087f75">Flywheel column frame</text><text x="937.5" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">FᵀF = 4I − J</text><path d="M937.5 166V190H540V223" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="275" y="225" width="530" height="96" rx="10" fill="white" stroke="#7048ba" stroke-width="1.5"/><text x="540.0" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7048ba">Common closure space: sum q = 0</text><text x="540.0" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">P = I − J/4 • G = 4P</text><text x="540" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#17263c">Transport YXᵀ/4 • composition independent of path</text><path d="M540 321V361" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="275" y="363" width="530" height="80" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Two parity-related simplices</text><text x="540.0" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">qᵢ ≥ −1 and qᵢ ≤ 1, with Σqᵢ = 0</text><path d="M540 443V465H280V487" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><path d="M540 443V465H800V487" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/><rect x="25" y="490" width="510" height="84" rx="10" fill="white" stroke="#087f75" stroke-width="1.5"/><text x="280.0" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#087f75">Shared octahedral core</text><text x="280.0" y="541" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">6 pair vertices • 12 edges • 8 faces</text><rect x="545" y="490" width="510" height="84" rx="10" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="800.0" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Eight stellations</text><text x="800.0" y="541" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">4 apex regions in each chamber</text><text x="540" y="609" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17263c">Proof 23: recursive subdivision is downstream of this geometry.</text><text x="540" y="635" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17263c">Physical metric selection, geometry-forming dynamics and gravitational coupling remain open.</text></svg></svg>
