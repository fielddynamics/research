<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc"><title id="title">The missing dynamical bridge</title><desc id="desc">What must connect algebraic torsion to effective SST dynamics</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="390" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">The missing dynamical bridge</text><rect x="45" y="90" width="250" height="150" rx="9" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="170.0" y="119" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#2563eb">Connection algebra</text><text x="170.0" y="143" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">e, ω; Levi-Civita</text><text x="170.0" y="163" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">and contorsion</text><text x="170.0" y="183" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Orientation-sensitive data</text><rect x="355" y="76" width="250" height="178" rx="9" fill="#fff1f2" stroke="#be123c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="480.0" y="105" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#be123c">Derivation required</text><text x="480.0" y="129" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Specify action and symmetry</text><text x="480.0" y="149" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Vary independent fields</text><text x="480.0" y="169" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Eliminate or evolve torsion</text><text x="480.0" y="189" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Derive stress and interface</text><rect x="665" y="90" width="250" height="150" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="790.0" y="119" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0f766e">Effective SST</text><text x="790.0" y="143" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Lapse response F − y</text><text x="790.0" y="163" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">μ(x) and NET Field rule</text><text x="790.0" y="183" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Causal matching</text><path d="M295 165L355 165" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M605 165L665 165" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="304" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#172033">Success criterion: recover the effective equations and their scope from the physical variables.</text><text x="480.0" y="371" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Research target, not a completed derivation.</text></svg>
