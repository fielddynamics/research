<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc"><title id="title">A drained child presents two different mass readings</title><desc id="desc">For a spherical quiet exterior the constitutive flux gives baryonic mass while the ordinary gradient gives mass divided by mu</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="440" rx="12" fill="white"/><text x="28" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#172033">A drained child presents two different mass readings</text><circle cx="230" cy="236" r="140" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/><circle cx="230" cy="236" r="103" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="230" cy="236" r="15" fill="#b45309" stroke="#b45309" stroke-width="1.6"/><path d="M275.0 236.0L316.0 236.0" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M268.97114317029974 258.5L304.47818472546174 279.0" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M252.5 274.97114317029974L273.0 310.4781847254617" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M230.0 281.0L230.0 322.0" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M207.5 274.97114317029974L187.00000000000003 310.47818472546174" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M191.02885682970026 258.5L155.52181527453826 279.0" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M185.0 236.0L144.0 236.0" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M191.02885682970026 213.5L155.52181527453826 193.00000000000003" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M207.49999999999997 197.02885682970026L186.99999999999997 161.5218152745383" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M230.0 191.0L229.99999999999997 150.0" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M252.5 197.02885682970026L273.0 161.52181527453828" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M268.97114317029974 213.49999999999997L304.4781847254617 192.99999999999997" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="230" y="78" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#7c3aed">Drained spherical child</text><text x="230" y="391" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f766e">Candidate interface Σ</text><path d="M333 202L397 161H426M333 267L397 303H426" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="430" y="100" width="490" height="105" rx="9" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="675.0" y="129" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0f766e">Constitutive flux</text><text x="675.0" y="153" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">∮ μ ∇Φ · n dS / (4πG) = M</text><text x="675.0" y="173" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Conserved source mass</text><rect x="430" y="243" width="490" height="105" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="675.0" y="272" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#b45309">Ordinary gradient flux</text><text x="675.0" y="296" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">∮ ∇Φ · n dS / (4πG) = M/μ</text><text x="675.0" y="316" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Apparent Newtonian mass at the surface</text><text x="480.0" y="421" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#475569">Which record the parent reads is an interface problem; no physical matching rule is assumed here.</text></svg>
