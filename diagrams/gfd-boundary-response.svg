<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" role="img" aria-labelledby="title desc"><title id="title">Registration as a boundary response</title><desc id="desc">A drained child is represented by its trace-to-flux functional while the parent and child jointly match the interface.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="900" height="485" rx="14" fill="white"/><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Registration as a boundary response</text><rect x="38" y="70" width="824" height="325" rx="12" fill="#64748b" fill-opacity=".065" stroke="#64748b" stroke-width="1.8"/><circle cx="285" cy="225" r="120" fill="#0d9488" fill-opacity=".065" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 5"/><text x="285" y="180" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#0d9488">Drained child D</text><text x="285" y="210" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#172033">Interior minimisation</text><text x="285" y="238" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#0d9488">Wᴅ[f]</text><text x="285" y="267" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">Own source and law</text><rect x="500" y="143" width="305" height="68" rx="12" fill="#7c3aed" fill-opacity=".065" stroke="#7c3aed" stroke-width="1.8"/><text x="652.5" y="177.0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Parent field</text><text x="652.5" y="202.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Potential outside the child</text><rect x="500" y="263" width="305" height="68" rx="12" fill="#64748b" fill-opacity=".065" stroke="#64748b" stroke-width="1.8"/><text x="652.5" y="297.0" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172033">Shared trace f</text><text x="652.5" y="322.0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Vary jointly at the interface</text><path d="M405 209H500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="452" y="194" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475569">flux</text><path d="M500 296H405" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="452" y="281" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475569">trace</text><path d="M652 211V263" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="429" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#172033">Minimise the residual energy + the child boundary value functional.</text><text x="450" y="457" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Conditional static partition lemma — overlapping GFD ownership remains open.</text></svg>